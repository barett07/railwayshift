<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>鐵路輪班小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#0a0c10; --s1:#111318; --s2:#181c24; --s3:#1e2330;
  --bdr:rgba(255,255,255,0.07); --bdr2:rgba(255,255,255,0.13);
  --acc:#f59e0b; --acc2:#fbbf24; --acc-d:rgba(245,158,11,0.12);
  --tx:#e8eaf0; --tx2:#9ca3b0; --tx3:#5a6070;
  --g:#10b981; --g-d:rgba(16,185,129,0.12);
  --r:#ef4444; --r-d:rgba(239,68,68,0.12);
  --b:#3b82f6; --b-d:rgba(59,130,246,0.12);
  --p:#a855f7; --p-d:rgba(168,85,247,0.12);
  --rad:12px; --rad-s:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans TC',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}

/* NAV */
.topbar{background:var(--s1);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;height:54px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;color:var(--acc);white-space:nowrap}
.nav-tabs{display:flex;gap:1px;flex:1;overflow-x:auto}
.nav-tab{background:none;border:none;cursor:pointer;color:var(--tx3);padding:6px 12px;font-size:12px;font-family:inherit;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;flex-shrink:0}
.nav-tab:hover{color:var(--tx2)}
.nav-tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.status-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--r);box-shadow:0 0 5px var(--r);transition:.3s}
.dot.on{background:var(--g);box-shadow:0 0 5px var(--g)}
.status-txt{font-size:10px;color:var(--tx3)}

/* LAYOUT */
.main{padding:20px 16px;max-width:960px;margin:0 auto;width:100%}
.page{display:none}.page.active{display:block}

/* HOME */
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:580px){.day-grid{grid-template-columns:1fr}}
.day-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);overflow:hidden}
.day-card.is-today{border-color:rgba(245,158,11,.25)}
.day-card.is-ex{border-color:rgba(59,130,246,.3)}
.dc-head{padding:14px 16px 10px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:flex-start}
.dc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3)}
.dc-date{font-size:14px;font-weight:700;margin-top:3px;font-family:'DM Mono',monospace}
.dc-wd{font-size:11px;color:var(--tx3);margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.badge-work{background:var(--acc-d);color:var(--acc)}
.badge-off{background:var(--r-d);color:var(--r)}
.badge-rest{background:var(--g-d);color:var(--g)}
.badge-leave{background:var(--b-d);color:var(--b)}
.badge-standby{background:var(--p-d);color:var(--p)}
.badge-unknown{background:var(--s3);color:var(--tx3)}
.ex-tag{font-size:10px;background:var(--b-d);color:var(--b);padding:2px 6px;border-radius:4px;margin-top:4px}

.dc-body{padding:14px 16px}
.shift-num{font-size:40px;font-weight:900;color:var(--acc);font-family:'DM Mono',monospace;letter-spacing:-.02em;line-height:1;margin-bottom:6px}
.s-note{display:inline-block;font-size:11px;color:var(--tx3);background:var(--s3);padding:2px 8px;border-radius:4px;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ti{background:var(--s2);border-radius:var(--rad-s);padding:9px 11px}
.ti-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.ti-val{font-size:17px;font-weight:700;font-family:'DM Mono',monospace}
.ti-val.hi{color:var(--acc)}
.ti-val.empty{color:var(--tx3);font-size:13px}
.ti-sub{font-size:10px;color:var(--tx3);margin-top:2px}
.ref-row{margin-top:10px;font-size:11px;color:var(--tx3);background:var(--s2);padding:7px 11px;border-radius:var(--rad-s);display:flex;gap:12px;flex-wrap:wrap}
.ref-item span{color:var(--tx2);font-family:'DM Mono',monospace}

.shift-img{width:100%;border-radius:var(--rad-s);margin-top:8px;border:1px solid var(--bdr);display:block}
.day-note{margin-top:10px;font-size:12px;color:var(--tx2);background:var(--s2);border-left:3px solid var(--acc);padding:7px 11px;border-radius:0 var(--rad-s) var(--rad-s) 0}
.no-work{padding:24px 16px;text-align:center}
.no-work-icon{font-size:32px;margin-bottom:8px}
.no-work-label{font-size:14px;color:var(--tx2);font-weight:500}
.no-work-sub{font-size:12px;color:var(--tx3);margin-top:4px}

.dc-foot{padding:10px 14px;border-top:1px solid var(--bdr);display:flex;gap:7px}
.btn-sm{flex:1;background:none;border:1px solid var(--bdr2);color:var(--tx2);padding:7px 8px;border-radius:var(--rad-s);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-sm:hover{border-color:var(--acc);color:var(--acc)}
.btn-sm.warn{border-color:rgba(239,68,68,.3);color:var(--r)}
.btn-sm.warn:hover{background:var(--r-d)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--bdr2);border-radius:var(--rad);padding:22px;width:100%;max-width:440px;box-shadow:0 16px 48px rgba(0,0,0,.6);transform:translateY(10px);transition:transform .2s;max-height:92vh;overflow-y:auto}
.overlay.open .modal{transform:translateY(0)}
.modal-wide{max-width:620px}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px;color:var(--acc)}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* FORMS */
.fg{margin-bottom:14px}
.fl{display:block;font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-weight:700}
.fi,.fs,.fta{width:100%;background:var(--s2);border:1px solid var(--bdr2);color:var(--tx);padding:8px 11px;border-radius:var(--rad-s);font-family:inherit;font-size:13px;transition:border-color .15s}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--acc)}
.fta{resize:vertical;min-height:72px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fhint{font-size:11px;color:var(--tx3);margin-top:4px}
.fcheck{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rad-s);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all .15s}
.btn-primary{background:var(--acc);color:#0a0c10;border-color:var(--acc)}
.btn-primary:hover{background:var(--acc2)}
.btn-secondary{background:var(--s2);color:var(--tx);border-color:var(--bdr2)}
.btn-secondary:hover{border-color:var(--tx2)}
.btn-ghost{background:none;color:var(--tx2);border-color:var(--bdr2)}
.btn-ghost:hover{border-color:var(--tx2);color:var(--tx)}
.btn-danger{background:var(--r-d);color:var(--r);border-color:rgba(239,68,68,.3)}

/* SECTION */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:9px}
.sec-title{font-size:18px;font-weight:900}
.sec-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);padding:18px;margin-bottom:14px}

/* SCHEDULE */
.seg-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:10px;overflow:hidden}
.seg-head{padding:12px 16px;background:var(--s2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.seg-badge.normal{background:var(--g-d);color:var(--g)}
.seg-badge.standby{background:var(--p-d);color:var(--p)}
.seg-dates{font-size:12px;color:var(--tx2);font-family:'DM Mono',monospace}
.seg-body{padding:14px 16px}

.cycle-list{display:flex;flex-direction:column;gap:5px}
.cycle-row{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:var(--rad-s);padding:7px 10px}
.cycle-num{font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace;width:34px;flex-shrink:0}
.c-sel{background:var(--s3);border:1px solid var(--bdr2);color:var(--tx);padding:4px 7px;border-radius:6px;font-family:inherit;font-size:12px}
.c-info{font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace;flex:1;text-align:right}
.ic-btn{width:26px;height:26px;background:none;border:1px solid var(--bdr);border-radius:5px;color:var(--tx3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.ic-btn:hover{border-color:var(--tx2);color:var(--tx)}
.ic-btn.del:hover{border-color:var(--r);color:var(--r)}
.ic-btn:disabled{opacity:.3;cursor:default}

/* STANDBY */
.sb-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px}
.sb-wd{text-align:center;font-size:10px;color:var(--tx3);padding:5px 0;font-weight:700}
.sb-day{aspect-ratio:1;border-radius:var(--rad-s);background:var(--s2);border:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:11px;font-weight:600;padding:3px}
.sb-day:hover{border-color:var(--acc)}
.sb-day.empty-d{background:none;border-color:transparent;cursor:default}
.sb-day.filled{background:var(--acc-d);border-color:rgba(245,158,11,.25)}
.sb-day.today-d{outline:2px solid var(--acc);outline-offset:1px}
.sb-shift{font-size:9px;color:var(--acc);font-family:'DM Mono',monospace;margin-top:1px}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:18px}
.cal-nav-btn{background:var(--s2);border:1px solid var(--bdr2);color:var(--tx);width:34px;height:34px;border-radius:var(--rad-s);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--acc);color:var(--acc)}
.cal-title{font-size:20px;font-weight:900;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.cal-title:hover{color:var(--acc)}
.cal-title::after{content:'▾';font-size:13px;color:var(--tx3)}
.cal-nav-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.cal-month-drop{position:absolute;top:calc(100% + 6px);background:var(--s2);border:1px solid var(--bdr2);border-radius:var(--rad-s);box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:50;min-width:130px;overflow:hidden;display:none}
.cal-month-drop.open{display:block}
.cal-month-opt{padding:11px 18px;font-size:15px;cursor:pointer;transition:background .1s}
.cal-month-opt:hover{background:var(--s3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hd{text-align:center;font-size:11px;color:var(--tx3);padding:7px 0;font-weight:700}
.cal-cell{background:var(--s1);border:1px solid var(--bdr);border-radius:7px;padding:7px 5px;min-height:76px;position:relative;border-left-width:3px;border-left-color:var(--bdr)}
.cal-cell.empty{background:none;border-color:transparent}
.cal-cell.today{outline:2px solid var(--acc);outline-offset:0}
.cal-cell.work{border-left-color:var(--acc)}
.cal-cell.off{border-left-color:var(--r)}
.cal-cell.rest{border-left-color:var(--g)}
.cal-cell.leave{border-left-color:var(--b)}
.cal-cell.standby{border-left-color:var(--p)}
.cc-day{font-size:12px;font-weight:700;margin-bottom:2px}
.cc-type{font-size:10px;color:var(--tx3)}
.cc-shift{font-size:11px;color:var(--acc);font-family:'DM Mono',monospace;font-weight:700}
.cc-time{font-size:10px;color:var(--tx3);font-family:'DM Mono',monospace}
.cc-ex{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--b)}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;justify-content:center}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3)}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* SHIFTS DB */
.shift-filter-row{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--s2);border:1px solid var(--bdr);color:var(--tx3);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.filter-btn.active{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.srch{flex:1;min-width:160px;background:var(--s2);border:1px solid var(--bdr2);color:var(--tx);padding:6px 11px;border-radius:var(--rad-s);font-family:inherit;font-size:13px}
.srch:focus{outline:none;border-color:var(--acc)}
.shifts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
.sc{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad-s);padding:13px;border-left-width:3px;border-left-color:var(--acc)}
.sc.variant{border-left-color:var(--p)}
.sc-name{font-size:16px;font-weight:900;color:var(--acc);font-family:'DM Mono',monospace;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.var-tag{font-size:9px;font-weight:700;background:var(--p-d);color:var(--p);padding:2px 5px;border-radius:3px;font-family:'Noto Sans TC',sans-serif}
.sc-note{font-size:11px;color:var(--tx3);margin-bottom:8px}
.sc-times{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}
.sct-label{color:var(--tx3)}
.sct-val{color:var(--tx);font-family:'DM Mono',monospace;font-weight:600}
.sc-ref{font-size:10px;color:var(--tx3);margin-top:6px;font-style:italic}
.on-badge{display:inline-block;font-size:10px;background:var(--p-d);color:var(--p);padding:2px 6px;border-radius:4px;margin-top:5px}
.sc-thumb{width:100%;border-radius:5px;margin-top:7px;max-height:56px;object-fit:cover}
.sc-foot{display:flex;gap:5px;margin-top:9px}

/* TOAST */
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--s1);border:1px solid var(--bdr2);color:var(--tx);padding:10px 14px;border-radius:var(--rad-s);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .2s ease;display:flex;align-items:center;gap:7px}
.toast.ok{border-left:3px solid var(--g)}
.toast.err{border-left:3px solid var(--r)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* LOADING */
.app-hidden{display:none!important}
.edit-only{display:none!important}
.edit-mode .edit-only{display:flex!important}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--tx3)}

/* MISC */
.sep{height:1px;background:var(--bdr);margin:14px 0}
.empty-state{text-align:center;padding:40px 16px;color:var(--tx3);border:1px dashed var(--bdr2);border-radius:var(--rad)}
.empty-icon{font-size:36px;margin-bottom:10px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

@media(max-width:580px){
  .main{padding:14px 11px}
  .cal-cell{min-height:60px}
  .cc-time{display:none}
  .f2{grid-template-columns:1fr}
  .nav-tab .nav-lbl{display:none}
}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div class="loading-txt" id="loadingTxt">連線中...</div>
</div>

<div id="app" class="app-hidden" style="flex-direction:column;min-height:100vh">
  <div class="topbar">
    <div class="brand">🚆 <span>鐵路輪班小幫手</span></div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('home')">⊙ <span class="nav-lbl">首頁</span></button>
      <button class="nav-tab" onclick="showPage('calendar')">▦ <span class="nav-lbl">月曆</span></button>
      <button class="nav-tab edit-only" onclick="showPage('schedule')">↻ <span class="nav-lbl">排班設定</span></button>
      <button class="nav-tab edit-only" onclick="showPage('shifts')">≡ <span class="nav-lbl">工作班</span></button>
    </div>
    <div class="status-wrap">
      <div class="dot" id="statusDot"></div>
      <span class="status-txt" id="statusTxt">離線</span>
    </div>
  </div>

  <div class="main">
    <!-- HOME -->
    <div id="page-home" class="page active">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <button class="cal-nav-btn" onclick="homeMove(-1)">‹</button>
        <div style="text-align:center">
          <div style="font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em" id="homeLabel">今日 / 明日</div>
          <div id="todayDisp" style="font-size:13px;font-weight:700;font-family:'DM Mono',monospace;margin-top:2px">—</div>
        </div>
        <button class="cal-nav-btn" onclick="homeMove(1)">›</button>
      </div>
      <div class="day-grid" id="dayCards"></div>
    </div>

    <!-- CALENDAR -->
    <div id="page-calendar" class="page">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calMove(-1)">‹</button>
        <div class="cal-nav-wrap">
          <div class="cal-title" id="calTitle" onclick="toggleCalDrop()"></div>
          <div class="cal-month-drop" id="calMonthDrop"></div>
        </div>
        <button class="cal-nav-btn" onclick="calMove(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--acc)"></div>工作班</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--r)"></div>例假</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--g)"></div>休班</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--b)"></div>特休</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--p)"></div>備勤</div>
        <div class="leg-item"><div class="cc-ex" style="position:static"></div>例外修改</div>
      </div>
      <div id="leaveStats" style="margin-top:16px;background:var(--s2);border:1px solid var(--b-d,rgba(59,130,246,0.3));border-radius:var(--rad);padding:16px;">
        <div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">🟠 當年度特休統計</div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span id="leaveCount" style="font-size:40px;font-weight:900;font-family:'DM Mono',monospace;color:var(--b)">0</span>
          <span style="font-size:14px;color:var(--tx2)">天</span>
          <span id="leaveYear" style="font-size:12px;color:var(--tx3);margin-left:4px"></span>
        </div>
      </div>
    </div>

    <!-- SCHEDULE -->
    <div id="page-schedule" class="page">
      <div class="sec-head">

// ══════════════════════════════════════════════
// SUPABASE REST API (no CDN required)
// ══════════════════════════════════════════════
const SB = SUPABASE_URL.replace(/\/+$/, '');
const SB_H = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};
async function sbFetch(path, opts){
  const r = await fetch(SB + path, {...opts, headers:{...SB_H,...(opts&&opts.headers||{})}});
  if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,120)); }
  return r.headers.get('content-length')==='0'||r.status===204 ? null : r.json();
}
async function loadRemote(){
  const data = await sbFetch('/rest/v1/app_data?select=key,value');
  const map = {};
  (data||[]).forEach(r => map[r.key] = r.value);
  ST.shifts = (map.shifts && map.shifts.length) ? map.shifts : [...BUILTIN];
  ST.segments = map.segments || [];
  ST.exceptions = map.exceptions || {};
  buildShiftMap();
}
async function dbSet(key, value){
  await sbFetch('/rest/v1/app_data', {
    method: 'POST',
    headers: {'Prefer': 'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify({key, value})
  });
}
async function initDB(){
  // Step 1: Always load local first — app is usable immediately
  loadLocal();
  // Step 2: If Supabase configured, try to sync in background
  if(SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
  try{
    const timeout = new Promise((_,rej) => setTimeout(()=>rej(new Error('逾時')), 6000));
    await Promise.race([loadRemote(), timeout]);
    dbReady = true; setStatus(true);
    // Refresh UI with remote data
    renderHome(); renderCal();
  }catch(e){
    console.warn('Supabase failed:', e.message);
    setStatus(false);
  }
}
function setStatus(on){
  try{
    const dot=document.getElementById('statusDot');
    const txt=document.getElementById('statusTxt');
    if(dot) dot.className='dot'+(on?' on':'');
    if(txt) txt.textContent=on?'已連線':'本地模式';
  }catch(e){}
}
async function pushShifts(){
  buildShiftMap();
  saveLocal();
  if(!dbReady) return;
  try{ await dbSet('shifts', ST.shifts); }catch(e){ console.error('pushShifts:', e.message); }
}
async function pushSegments(){
  saveLocal();
  if(!dbReady) return;
  try{ await dbSet('segments', ST.segments); }catch(e){ console.error('pushSegments:', e.message); }
}
async function pushException(ds, data){
  if(data) ST.exceptions[ds] = data; else delete ST.exceptions[ds];
  saveLocal();
  if(!dbReady) return;
  try{ await dbSet('exceptions', ST.exceptions); }catch(e){ console.error('pushException:', e.message); }
}
function loadLocal(){
  setStatus(false);
  try{
    const sh=localStorage.getItem('rw2_shifts'); ST.shifts=sh?JSON.parse(sh):[...BUILTIN];
    const seg=localStorage.getItem('rw2_segments'); ST.segments=seg?JSON.parse(seg):[];
    const ex=localStorage.getItem('rw2_exceptions'); ST.exceptions=ex?JSON.parse(ex):{};
  }catch{ ST.shifts=[...BUILTIN]; }
  buildShiftMap();
}
function saveLocal(){
  try{
    localStorage.setItem('rw2_shifts',JSON.stringify(ST.shifts));
    localStorage.setItem('rw2_segments',JSON.stringify(ST.segments));
    localStorage.setItem('rw2_exceptions',JSON.stringify(ST.exceptions));
  }catch{}
}

// DATE UTILS
// ══════════════════════════════════════════════
const p2=n=>String(n).padStart(2,'0');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
const WD=['日','一','二','三','四','五','六'];
function wd(ds){ return WD[new Date(ds+'T00:00:00').getDay()]; }
function fmtDate(ds){ const[y,m,d]=ds.split('-'); return `${y}/${m}/${d}（${wd(ds)}）`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function fmt(t){ return t||'—'; }

// ══════════════════════════════════════════════
// SCHEDULE LOGIC
// ══════════════════════════════════════════════
function getDayInfo(ds){
  if(ST.exceptions[ds]) return {...ST.exceptions[ds],isEx:true};
  const seg=ST.segments
    .filter(s=>s.startDate<=ds&&(!s.endDate||s.endDate>=ds))
    .sort((a,b)=>b.startDate.localeCompare(a.startDate))[0];
  if(!seg) return {type:'unknown'};
  if(seg.type==='standby'){
    const d=seg.standbyData?.[ds];
    return d?{type:'standby',...d,segId:seg.id}:{type:'standby',shiftId:null,segId:seg.id};
  }
  if(!seg.cycle?.length) return {type:'unknown'};
  const i=diffDays(seg.startDate,ds)%seg.cycle.length;
  return i>=0?{...seg.cycle[Math.max(0,i)]}:{type:'unknown'};
}
function buildShiftMap(){
  ST._shiftMap = {};
  ST.shifts.forEach(s=>{ ST._shiftMap[s.id]=s; });
}
function getShift(id){ return ST._shiftMap?ST._shiftMap[id]:ST.shifts.find(s=>s.id===id); }

const TC={work:'work',off:'off',rest:'rest',leave:'leave',standby:'standby',unknown:''};

function renderHome(){
  const today=todayStr();

  const d2=addDays(today,homeOffset+1);
  const isBase=homeOffset===0;
  const label1=isBase?'今日':(homeOffset===1?'明日':fmtDate(d1));
  const label2=isBase?'明日':(homeOffset===1?'後日':fmtDate(d2));
  document.getElementById('homeLabel').textContent=`${d1} ／ ${d2}`;
  document.getElementById('todayDisp').textContent=isBase?'今日 ／ 明日':'';
  document.getElementById('dayCards').innerHTML=buildDayCard(d1,label1,d1===today)+buildDayCard(d2,label2,d2===today);
}

  homeOffset+=dir;

}

function renderCal(){
  document.getElementById('calTitle').textContent=`${calY} 年 ${calM} 月`;
  const days=daysInMonth(calY,calM), first=new Date(calY,calM-1,1).getDay(), today=todayStr();
  let h=['日','一','二','三','四','五','六'].map(w=>`<div class="cal-hd">${w}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${calY}-${p2(calM)}-${p2(d)}`;
    const info=getDayInfo(ds), sh=info.shiftId?getShift(info.shiftId):null;
    const cls=TC[info.type]||'';
    const shiftName=sh?sh.name:(info.type==='work'&&info.shiftId?info.shiftId:'');
    const board=info.customBoard||(sh?sh.boardTime||'':'');
    h+=`<div class="cal-cell ${cls} ${ds===today?'today':''}" onclick="goToDate('${ds}')" style="cursor:pointer">
      ${info.isEx?'<div class="cc-ex"></div>':''}
      <div class="cc-day">${d}</div>
      <div class="cc-type">${TL[info.type]||''}</div>
      ${shiftName?`<div class="cc-shift">${shiftName}</div>`:''}
      ${shiftName&&board?`<div class="cc-time">↑${board}</div>`:''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML=h;
}
function calcLeaveStats(){
  const thisYear=new Date().getFullYear();
  let leaveCount=0;
  let d2=new Date(`${thisYear}-01-01T00:00:00`);
  const endD=new Date(`${thisYear}-12-31T00:00:00`);
  while(d2<=endD){
    const ds2=`${d2.getFullYear()}-${p2(d2.getMonth()+1)}-${p2(d2.getDate())}`;
    if(getDayInfo(ds2).type==='leave') leaveCount++;
    d2.setDate(d2.getDate()+1);
  }
  const lcEl=document.getElementById('leaveCount');
  const lyEl=document.getElementById('leaveYear');
  if(lcEl) lcEl.textContent=leaveCount;
  if(lyEl) lyEl.textContent=`（${thisYear} 年度）`;
}
function calMove(dir){ calM+=dir; if(calM>12){calM=1;calY++;}else if(calM<1){calM=12;calY--;} renderCal(); }
function toggleCalDrop(){
  const drop=document.getElementById('calMonthDrop');
  if(drop.classList.contains('open')){drop.classList.remove('open');return;}
  const offsets=[-1,1,2,3];
  drop.innerHTML=offsets.map(o=>{
    let y=calY,m=calM+o;
    if(m>12){m-=12;y++;}else if(m<1){m+=12;y--;}
    return `<div class="cal-month-opt" onclick="jumpCalTo(${y},${m})">${y} 年 ${m} 月</div>`;
  }).join('');
  drop.classList.add('open');
}
function jumpCalTo(y,m){calY=y;calM=m;renderCal();document.getElementById('calMonthDrop').classList.remove('open');}
document.addEventListener('click',e=>{
  const drop=document.getElementById('calMonthDrop');
  if(drop&&!drop.contains(e.target)&&e.target.id!=='calTitle'){drop.classList.remove('open');}
});
function goToDate(ds){
  const today=todayStr();
  const offset=diffDays(today,ds);

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

}

function sortShifts(arr){
  return [...arr].sort((a,b)=>{
    // Extract numeric prefix and suffix
    const parse=name=>{
      const m=name.match(/^(\d+)(.*)/);
      return m?[parseInt(m[1]),m[2]]:[9999,name];
    };
    const [an,as]=parse(a.name), [bn,bs]=parse(b.name);
    if(an!==bn) return an-bn;
    // Same number: base shift before variants (no suffix < AV < V < others)
    const rank=s=>s===''?0:s==='AV'?1:s==='V'?2:3;
    return rank(as)-rank(bs)||as.localeCompare(bs);
  });
}

      <div class="fg"><label class="fl">首班車次（參考）</label><input class="fi" id="edt" value="${s?.depTrain||''}" placeholder="如 108(3000)"></div>
      <div class="fg"><label class="fl">末班車次（參考）</label><input class="fi" id="eat2" value="${s?.arrTrain||''}" placeholder="如 139"></div>
    </div>`,
    [{label:'取消',cls:'btn-secondary',fn:'closeM()'},{label:'儲存',cls:'btn-primary',fn:`saveShift('${id||''}')`}],
    true
  );
}
function saveShift(id){
  const name=document.getElementById('en').value.trim();
  if(!name){toast('請輸入班號','err');return;}
  const entry={id:id||'sh_'+Date.now(),name,
    specialNote:document.getElementById('esn').value.trim(),
    startTime:document.getElementById('est').value,
    endTime:document.getElementById('eet').value,
    boardTime:document.getElementById('ebt').value,
    alightTime:document.getElementById('eat').value,
    depTrain:document.getElementById('edt').value.trim(),
    arrTrain:document.getElementById('eat2').value.trim(),
    isOvernight:false,
    imageUrl:id?(ST.shifts.find(s=>s.id===id)?.imageUrl||''):'',
  };
  if(id) ST.shifts=ST.shifts.map(s=>s.id===id?entry:s); else ST.shifts.push(entry);
  ST.shifts=sortShifts(ST.shifts);
  pushShifts().then(()=>{renderShifts();closeM();toast('已儲存','ok');});
}
function deleteShift(id){ if(!confirm('確定刪除？'))return; ST.shifts=ST.shifts.filter(s=>s.id!==id); pushShifts().then(()=>{renderShifts();toast('已刪除','ok');}); }

// ── IMPORT EXCEL ──
function openImportXLSX(){
  parsedXLSX=null;
  setModal('匯入 Excel 工作班資料',`
    <div style="font-size:12px;color:var(--tx3);margin-bottom:12px">
      上傳公司提供的 Excel 班表，系統自動讀取上下班時間。<br>
      <b style="color:var(--acc)">上下班搭車時間需自行在工作班編輯中設定，匯入後已設定的搭車時間將保留。</b>
    </div>
    <div class="fg"><label class="fl">選擇 Excel 檔案</label>
      <input type="file" id="xlFile" accept=".xlsx,.xls" style="color:var(--tx2);font-size:13px"></div>
    <div id="xlPrev" style="font-size:12px;color:var(--tx3);margin-top:8px"></div>`,
    [{label:'取消',cls:'btn-secondary',fn:'closeM()'},{label:'確認匯入',cls:'btn-primary',fn:'doImport()'}]
  );
  setTimeout(()=>document.getElementById('xlFile').addEventListener('change',parseXLSX),100);
}
function parseXLSX(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let hr=-1;
      for(let i=0;i<rows.length;i++){ if(rows[i].some(c=>String(c).trim()==='工作班')){hr=i;break;} }
      if(hr<0){document.getElementById('xlPrev').textContent='❌ 找不到「工作班」欄位';return;}
      // Build column index map from header row
      const colMap={};
      rows[hr].forEach((h,i)=>{ const k=String(h).trim(); if(k) colMap[k]=i; });
      // Check required columns
      const required=['工作班','上班時間','下班時間'];
      const missing=required.filter(k=>colMap[k]===undefined);
      if(missing.length){document.getElementById('xlPrev').textContent='❌ 找不到欄位：'+missing.join('、');parsedXLSX=null;return;}
      // Map optional columns with fallback aliases
      const ci={
        name:colMap['工作班'],
        startTime:colMap['上班時間'],
        endTime:colMap['下班時間'],
        specialNote:colMap['工作班特定行駛']??colMap['特定行駛']??colMap['備註']??-1,
        depTrain:colMap['上班車次']??-1,
        depTime:colMap['開車時間']??-1,
        arrTrain:colMap['下班車次']??-1,
        arrTime:colMap['到達時間']??-1,
      };
      const toT=v=>{
        if(!v&&v!==0)return '';
        const s=String(v).trim();
        if(s.includes(':')){ const p=s.split(':'); return p[0].padStart(2,'0')+':'+p[1].padStart(2,'0'); }
        if(typeof v==='number'){ const m=Math.round(v*24*60); return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
        return '';
      };
      parsedXLSX=[];
      for(let r=hr+1;r<rows.length;r++){
        const row=rows[r], name=String(row[ci.name]||'').trim();
        if(!name||name==='nan')continue;
        const st=toT(row[ci.startTime]),et=toT(row[ci.endTime]);
        const ex=ST.shifts.find(s=>s.id===name)||{};
        parsedXLSX.push({id:name,name,startTime:st,endTime:et,
          depTrain:ci.depTrain>=0?String(row[ci.depTrain]||'').trim().replace('nan',''):'',
          depTime:ci.depTime>=0?toT(row[ci.depTime]):'',
          arrTrain:ci.arrTrain>=0?String(row[ci.arrTrain]||'').trim().replace('nan',''):'',
          arrTime:ci.arrTime>=0?toT(row[ci.arrTime]):'',
          specialNote:ci.specialNote>=0?String(row[ci.specialNote]||'').trim().replace('nan',''):'',
          isOvernight:false,
          boardTime:ex.boardTime||'',
          alightTime:ex.alightTime||'',
          imageUrl:ex.imageUrl||'',
        });
      }
      if(!parsedXLSX.length){document.getElementById('xlPrev').textContent='❌ 未找到任何有效工作班資料';parsedXLSX=null;return;}
      document.getElementById('xlPrev').textContent=`✅ 解析完成：${parsedXLSX.length} 個工作班，已設定的搭車時間將保留`;
    }catch(err){document.getElementById('xlPrev').textContent='❌ 解析失敗：'+err.message; parsedXLSX=null;}
  };
  reader.readAsArrayBuffer(file);
}
function doImport(){
  if(!parsedXLSX?.length){toast('請先選擇 Excel 檔案','err');return;}
  if(!confirm(`確認匯入 ${parsedXLSX.length} 個工作班？`))return;
  ST.shifts=sortShifts(parsedXLSX); parsedXLSX=null;
  pushShifts().then(()=>{renderShifts();closeM();toast(`已匯入 ${ST.shifts.length} 個工作班`,'ok');});
}

// ══════════════════════════════════════════════
// MODAL / TOAST / NAV / INIT
// ══════════════════════════════════════════════
function setModal(title,body,actions,wide){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalBox').className='modal'+(wide?' modal-wide':'');
  document.getElementById('modalActions').innerHTML=actions.map(a=>`<button class="btn ${a.cls}" onclick="${a.fn}">${a.label}</button>`).join('');
  document.getElementById('overlay').classList.add('open');
}
function overlayClick(e){ if(e.target===document.getElementById('overlay'))closeM(); }
function closeM(){ document.getElementById('overlay').classList.remove('open'); }
function toast(msg,type='ok'){ const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; document.getElementById('toastWrap').appendChild(el); setTimeout(()=>el.remove(),3000); }
function showPage(name){
  const already=document.getElementById('page-'+name)?.classList.contains('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const idx={home:0,calendar:1,schedule:2,shifts:3};
  document.querySelectorAll('.nav-tab')[idx[name]]?.classList.add('active');
  if(name==='home'){ if(already) homeOffset=0; renderHome(); }
  if(name==='calendar'){ if(already||!calY||!calM){calY=new Date().getFullYear();calM=new Date().getMonth()+1;} renderCal(); calcLeaveStats(); }
  if(name==='schedule')renderSegs();
  if(name==='shifts')renderShifts();
}
function showApp(){
  document.getElementById('loading').style.display='none';
  const app=document.getElementById('app');
  app.classList.remove('app-hidden');
  app.style.display='flex';
  if(EDIT_MODE) app.classList.add('edit-mode');
  renderHome();
}
function init(){
  try{
    try{ loadLocal(); }catch(e){ console.warn('loadLocal failed:',e); ST.shifts=[...BUILTIN]; ST.segments=[]; ST.exceptions={}; }
    showApp();
    setTimeout(()=>{ initDB().catch(e=>console.warn('Supabase error:',e)); }, 100);
  }catch(err){
    console.error('FATAL init error:', err);
    // Force-show app as last resort
    try{
      document.getElementById('loading').style.display='none';
      document.getElementById('app').style.display='flex';
      document.getElementById('app').classList.remove('app-hidden');
      document.body.innerHTML+='<div style="position:fixed;top:60px;left:10px;right:10px;background:#4a1414;color:#f87171;padding:16px;border-radius:8px;z-index:9999;font-size:13px;">⚠️ 初始化錯誤：'+err.message+'<br><br>請截圖給開發者。</div>';
    }catch(e2){}
  }
}

// Safety net: force-hide loading after 3 seconds no matter what
setTimeout(function(){
  try{
    var l=document.getElementById('loading');
    var a=document.getElementById('app');
    if(l && l.style.display!=='none'){
      l.style.display='none';
      if(a){ a.style.display='flex'; a.classList.remove('app-hidden'); }
      document.body.innerHTML+='<div style="position:fixed;top:60px;left:10px;right:10px;background:#4a3010;color:#fbbf24;padding:16px;border-radius:8px;z-index:9999;font-size:13px;">⚠️ 強制顯示（啟動超時）。如果看到這個訊息表示 JavaScript 初始化有問題。</div>';
    }
  }catch(e){}
}, 3000);

// Run init
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
