<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<title>鐵路輪班小幫手</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#000000; --s1:#1C1C1E; --s2:#2C2C2E; --s3:#3A3A3C;
  --bdr:rgba(255,255,255,0.08); --bdr2:rgba(255,255,255,0.14);
  --acc:#FF9F0A; --acc2:#FFB340; --acc-d:rgba(255,159,10,0.16);
  --tx:#F2F2F7; --tx2:#98989F; --tx3:#6E6E73;
  --g:#30D158; --g-d:rgba(48,209,88,0.15);
  --r:#FF453A; --r-d:rgba(255,69,58,0.15);
  --b:#0A84FF; --b-d:rgba(10,132,255,0.15);
  --p:#BF5AF2; --p-d:rgba(191,90,242,0.15);
  --cyan:#64D2FF;
  --rad:18px; --rad-s:10px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --glass:rgba(28,28,30,.72); --glass-edge:rgba(255,255,255,.12);
  --glass-lq:rgba(28,28,30,.5);
  --dim:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F2F2F7; --s1:#FFFFFF; --s2:#F2F2F7; --s3:#E5E5EA;
    --bdr:rgba(60,60,67,0.12); --bdr2:rgba(60,60,67,0.2);
    --acc:#FF9500; --acc2:#FFB340; --acc-d:rgba(255,149,0,0.14);
    --tx:#1C1C1E; --tx2:#6C6C70; --tx3:#8E8E93;
    --g:#34C759; --g-d:rgba(52,199,89,0.14);
    --r:#FF3B30; --r-d:rgba(255,59,48,0.13);
    --b:#007AFF; --b-d:rgba(0,122,255,0.12);
    --p:#AF52DE; --p-d:rgba(175,82,222,0.13);
    --cyan:#32ADE6;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
    --glass:rgba(249,249,249,.75); --glass-edge:rgba(255,255,255,.6);
    --glass-lq:rgba(255,255,255,.55);
    --dim:rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;-webkit-tap-highlight-color:transparent}

/* NAV — 毛玻璃頂欄 + 底部浮動 Tab Bar */
.topbar{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;height:54px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--acc);white-space:nowrap}
.tabbar{position:fixed;left:50%;bottom:max(8px,calc(env(safe-area-inset-bottom) - 16px));transform:translateX(-50%);z-index:150;display:flex;gap:3px;padding:5px;border-radius:999px;background:var(--glass-lq);-webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);border:1px solid var(--glass-edge);box-shadow:0 12px 40px rgba(0,0,0,.32),0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 1px rgba(255,255,255,.05);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab-lens{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--acc-d);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 1px rgba(255,255,255,.06),0 2px 10px rgba(0,0,0,.15);pointer-events:none;transition:transform .5s cubic-bezier(.3,1.35,.35,1),width .5s cubic-bezier(.3,1.35,.35,1)}
.nav-tab{position:relative;background:none;border:none;cursor:pointer;color:var(--tx2);padding:9px 14px;font-size:13px;font-weight:600;font-family:inherit;border-radius:999px;transition:transform .1s ease-out,color .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:44px}
.nav-tab:hover{color:var(--tx)}
.nav-tab.active{color:var(--acc)}
.nav-tab svg{width:19px;height:19px;flex-shrink:0}
.status-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
.clock{font-size:14px;font-weight:600;color:var(--tx2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--r);box-shadow:0 0 5px var(--r);transition:.3s}
.dot.on{background:var(--g);box-shadow:0 0 5px var(--g)}
.status-txt{font-size:10px;color:var(--tx3)}

/* LAYOUT */
.main{padding:20px 16px calc(96px + env(safe-area-inset-bottom));max-width:960px;margin:0 auto;width:100%}
.page{display:none}.page.active{display:block}
.slide-l{animation:pageSlideL .34s cubic-bezier(.32,.72,.28,1)}
.slide-r{animation:pageSlideR .34s cubic-bezier(.32,.72,.28,1)}
@keyframes pageSlideL{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes pageSlideR{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}

/* HOME */
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:580px){.day-grid{grid-template-columns:1fr}}
.day-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow)}
.day-card.is-today{border-color:rgba(255,159,10,.35)}
.day-card.is-ex{border-color:rgba(100,210,255,.35)}
.dc-head{padding:14px 16px 10px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:flex-start}
.dc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3)}
.dc-date{font-size:14px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.dc-wd{font-size:11px;color:var(--tx3);margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:-.005em}
.badge-work{background:var(--acc-d);color:var(--acc)}
.badge-off{background:var(--r-d);color:var(--r)}
.badge-rest{background:var(--g-d);color:var(--g)}
.badge-leave{background:var(--b-d);color:var(--b)}
.badge-standby{background:var(--p-d);color:var(--p)}
.badge-unknown{background:var(--s3);color:var(--tx3)}
.ex-tag{font-size:10px;background:var(--b-d);color:var(--b);padding:2px 6px;border-radius:4px;margin-top:4px}

.dc-body{padding:14px 16px}
.shift-num{font-size:42px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1;margin-bottom:6px}
.s-note{display:inline-block;font-size:11px;color:var(--tx3);background:var(--s3);padding:2px 8px;border-radius:4px;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ti{background:var(--s2);border-radius:var(--rad-s);padding:9px 11px}
.ti-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.ti-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ti-val.hi{color:var(--acc)}
.ti-val.empty{color:var(--tx3);font-size:13px}
.ti-sub{font-size:10px;color:var(--tx3);margin-top:2px}
.ref-row{margin-top:10px;font-size:11px;color:var(--tx3);background:var(--s2);padding:7px 11px;border-radius:var(--rad-s);display:flex;gap:12px;flex-wrap:wrap}
.ref-item span{color:var(--tx2);font-variant-numeric:tabular-nums}

.shift-img{width:100%;border-radius:var(--rad-s);margin-top:8px;border:1px solid var(--bdr);display:block}
.day-note{margin-top:10px;font-size:12px;color:var(--tx2);background:var(--s2);border-left:3px solid var(--acc);padding:7px 11px;border-radius:0 var(--rad-s) var(--rad-s) 0}
.no-work{padding:24px 16px;text-align:center}
.no-work-icon{font-size:32px;margin-bottom:8px}
.no-work-label{font-size:14px;color:var(--tx2);font-weight:500}
.no-work-sub{font-size:12px;color:var(--tx3);margin-top:4px}

.dc-foot{padding:10px 14px;border-top:1px solid var(--bdr);display:flex;gap:7px}
.btn-sm{flex:1;background:none;border:1px solid var(--bdr2);color:var(--tx2);padding:10px 8px;border-radius:var(--rad-s);cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:40px}
.btn-sm:hover{border-color:var(--acc);color:var(--acc)}
.btn-sm.warn{border-color:rgba(239,68,68,.3);color:var(--r)}
.btn-sm.warn:hover{background:var(--r-d)}

/* MODAL — 桌面置中對話框；手機改為底部彈簧面板（JS 彈簧驅動） */
.overlay{position:fixed;inset:0;background:var(--dim);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--bdr2);border-radius:var(--rad);padding:22px;width:100%;max-width:440px;box-shadow:0 16px 48px rgba(0,0,0,.6);transform:translateY(10px);transition:transform .2s;max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
.overlay.open .modal{transform:translateY(0)}
.modal-wide{max-width:620px}
.modal-grab{display:none}
@media(max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .modal,.modal-wide{max-width:none;border:none;border-top:1px solid var(--glass-edge);border-radius:22px 22px 0 0;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;transition:none;transform:translateY(105%);will-change:transform}
  .overlay.open .modal{transform:translateY(105%)}
  .modal-grab{display:block;width:38px;height:5px;border-radius:999px;background:var(--tx3);opacity:.55;margin:6px auto 14px;cursor:grab;touch-action:none}
}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px;color:var(--acc)}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* FORMS */
.fg{margin-bottom:14px}
.fl{display:block;font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-weight:700}
.fi,.fs,.fta{width:100%;background:var(--s2);border:1px solid var(--bdr2);color:var(--tx);padding:9px 11px;border-radius:var(--rad-s);font-family:inherit;font-size:16px;transition:border-color .15s}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--acc)}
.fta{resize:vertical;min-height:72px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fhint{font-size:11px;color:var(--tx3);margin-top:4px}
.fcheck{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--rad-s);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all .15s;min-height:40px}
.btn-primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-primary:hover{background:var(--acc2)}
.btn-secondary{background:var(--s2);color:var(--tx);border-color:var(--bdr2)}
.btn-secondary:hover{border-color:var(--tx2)}
.btn-ghost{background:none;color:var(--tx2);border-color:var(--bdr2)}
.btn-ghost:hover{border-color:var(--tx2);color:var(--tx)}
.btn-danger{background:var(--r-d);color:var(--r);border-color:rgba(239,68,68,.3)}

/* 按壓即回饋：pointer-down 瞬間縮小（Apple design：react on pointer-down） */
.btn:active,.btn-sm:active,.nav-tab:active,.cal-nav-btn:active,.live-pill:active,.filter-btn:active,.ic-btn:active,.sb-day:active,.tdx-pick:active,.live-swap-btn:active{transform:scale(.96)}
.tdx-pick{transition:transform .1s ease-out,background .15s,border-color .15s}
.live-swap-btn{transition:transform .1s ease-out,border-color .15s,color .15s}

/* 鍵盤焦點外框（只在鍵盤導航時出現） */
button:focus-visible,.btn:focus-visible,.btn-sm:focus-visible,.nav-tab:focus-visible,.filter-btn:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--rad-s)}
.fi:focus-visible,.fs:focus-visible,.fta:focus-visible,.srch:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* SECTION */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:9px}
.sec-title{font-size:18px;font-weight:900}
.sec-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);padding:18px;margin-bottom:14px}

/* SCHEDULE */
.seg-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);margin-bottom:10px;overflow:hidden}
.seg-head{padding:12px 16px;background:var(--s2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.seg-badge.normal{background:var(--g-d);color:var(--g)}
.seg-badge.standby{background:var(--p-d);color:var(--p)}
.seg-dates{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.seg-body{padding:14px 16px}

.cycle-list{display:flex;flex-direction:column;gap:5px}
.cycle-row{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:var(--rad-s);padding:7px 10px}
.cycle-num{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums;width:34px;flex-shrink:0}
.c-sel{background:var(--s3);border:1px solid var(--bdr2);color:var(--tx);padding:4px 7px;border-radius:6px;font-family:inherit;font-size:12px}
.c-info{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums;flex:1;text-align:right}
.ic-btn{width:26px;height:26px;background:none;border:1px solid var(--bdr);border-radius:5px;color:var(--tx3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.ic-btn:hover{border-color:var(--tx2);color:var(--tx)}
.ic-btn.del:hover{border-color:var(--r);color:var(--r)}
.ic-btn:disabled{opacity:.3;cursor:default}

/* STANDBY */
.sb-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px}
.sb-wd{text-align:center;font-size:10px;color:var(--tx3);padding:5px 0;font-weight:700}
.sb-day{aspect-ratio:1;border-radius:var(--rad-s);background:var(--s2);border:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:11px;font-weight:600;padding:3px}
.sb-day:hover{border-color:var(--acc)}
.sb-day.empty-d{background:none;border-color:transparent;cursor:default}
.sb-day.filled{background:var(--acc-d);border-color:rgba(255,159,10,.3)}
.sb-day.today-d{outline:2px solid var(--acc);outline-offset:1px}
.sb-shift{font-size:9px;color:var(--acc);font-variant-numeric:tabular-nums;margin-top:1px}

/* CALENDAR — 大卡片 + 無框格子（Apple design 預覽版樣式） */
.cal-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad);padding:16px 12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:0 6px}
.cal-nav-btn{background:var(--s2);border:none;color:var(--acc);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .1s ease-out,background .15s}
.cal-nav-btn:hover{background:var(--s3)}
.cal-nav-btn:active{transform:scale(.92)}
.cal-title{font-size:20px;font-weight:900;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.cal-title:hover{color:var(--acc)}
.cal-title::after{content:'▾';font-size:13px;color:var(--tx3)}
.cal-nav-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.cal-month-drop{position:absolute;top:calc(100% + 6px);background:var(--s2);border:1px solid var(--bdr2);border-radius:var(--rad-s);box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:50;min-width:130px;overflow:hidden;display:none}
.cal-month-drop.open{display:block}
.cal-month-opt{padding:11px 18px;font-size:15px;cursor:pointer;transition:background .1s}
.cal-month-opt:hover{background:var(--s3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hd{text-align:center;font-size:12px;color:var(--tx3);padding:7px 0;font-weight:600}
.cal-cell{background:none;border:none;border-radius:10px;padding:8px 2px;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
@media(min-width:581px){.cal-cell{aspect-ratio:1/1.05;justify-content:flex-start;padding-top:14px}}
.cal-cell.empty{cursor:default}
.cal-cell.empty .cc-day{color:var(--tx3);opacity:.55}
.cc-day{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.today .cc-day{background:var(--acc);color:#fff;font-weight:700}
.cc-type{font-size:12px;font-weight:600;color:var(--tx3)}
.cal-cell.off .cc-type{color:var(--r)}
.cal-cell.rest .cc-type{color:var(--g)}
.cal-cell.leave .cc-type{color:var(--b)}
.cal-cell.standby .cc-type{color:var(--p)}
.cc-shift{font-size:12px;color:var(--acc);font-variant-numeric:tabular-nums;font-weight:700}
.cc-time{display:none}
.cc-dot{width:6px;height:6px;border-radius:50%;margin-top:2px}
.cal-cell.work .cc-dot{background:var(--acc)}
.cal-cell.off .cc-dot{background:var(--r)}
.cal-cell.rest .cc-dot{background:var(--g)}
.cal-cell.leave .cc-dot{background:var(--b)}
.cal-cell.standby .cc-dot{background:var(--p)}
.cc-ex{position:absolute;top:4px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;justify-content:center}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3)}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* SHIFTS DB */
.shift-filter-row{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--s2);border:1px solid var(--bdr);color:var(--tx3);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s;min-height:36px}
.filter-btn.active{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.srch{flex:1;min-width:160px;background:var(--s2);border:1px solid var(--bdr2);color:var(--tx);padding:8px 11px;border-radius:var(--rad-s);font-family:inherit;font-size:16px}
.srch:focus{outline:none;border-color:var(--acc)}
.shifts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
.sc{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rad-s);padding:13px;border-left-width:3px;border-left-color:var(--acc)}
.sc.variant{border-left-color:var(--p)}
.sc-name{font-size:16px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.var-tag{font-size:9px;font-weight:700;background:var(--p-d);color:var(--p);padding:2px 5px;border-radius:3px}
.sc-note{font-size:11px;color:var(--tx3);margin-bottom:8px}
.sc-times{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}
.sct-label{color:var(--tx3)}
.sct-val{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:600}

.sc-foot{display:flex;gap:5px;margin-top:9px}

/* TOAST（避開底部 Tab Bar） */
.toast-wrap{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));right:18px;z-index:999;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--s1);border:1px solid var(--bdr2);color:var(--tx);padding:10px 14px;border-radius:var(--rad-s);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .2s ease;display:flex;align-items:center;gap:7px}
.toast.ok{border-left:3px solid var(--g)}
.toast.err{border-left:3px solid var(--r)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* LOADING */
.app-hidden{display:none!important}
.edit-only{display:none!important}
.edit-mode .edit-only{display:flex!important}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--tx3)}

/* COMPACT MODE — 給 Apple Watch 透過 ?compact=1 使用 */

.compact-mode .tabbar{display:none}
.compact-mode .main{padding:10px 8px;max-width:none}
.compact-mode .day-grid{grid-template-columns:1fr;gap:10px}
.compact-mode .day-card{border-radius:10px}
.compact-mode .dc-head{padding:10px 12px 8px}
.compact-mode .dc-label{font-size:11px}
.compact-mode .dc-date{font-size:16px}
.compact-mode .dc-wd{font-size:12px}
.compact-mode .badge{font-size:13px !important;padding:5px 12px !important}
.compact-mode .ex-toggle{display:none}
.compact-mode .dc-body{padding:10px}
.compact-mode .dc-body > *:not(.shift-img):not(.day-note){display:none !important}
.compact-mode .day-note{font-size:13px;padding:9px 12px}
.compact-mode .no-work{padding:30px 16px}
.compact-mode .no-work-label{font-size:16px}
.compact-mode .no-work-sub{font-size:13px}
.compact-mode .cal-nav-btn{min-width:44px;min-height:44px}
.compact-mode #homeLabel{font-size:11px}
.compact-mode #todayDisp{font-size:14px}
.compact-mode .shift-img{margin-top:10px;border-radius:6px}

/* MISC */
.sep{height:1px;background:var(--bdr);margin:14px 0}
.empty-state{text-align:center;padding:40px 16px;color:var(--tx3);border:1px dashed var(--bdr2);border-radius:var(--rad)}
.empty-icon{font-size:36px;margin-bottom:10px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

/* 觸控裝置：取消 hover 視覺殘留（手機/平板點完按鈕後狀態不會卡住）

/* TDX 車次 picker（疊在 shift 編輯 Modal 之上的小視窗） */
.tdx-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
.tdx-picker-overlay.open{display:flex}
.tdx-picker-box{background:var(--s1);border:1px solid var(--bdr2);border-radius:var(--rad);padding:18px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}

.tdx-pick-sub{font-size:11px}

/* 即時查車分頁 */
.live-od-label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;font-weight:700}

.live-pill{flex:1;background:var(--s2);border:1px solid var(--bdr2);color:var(--tx2);padding:11px 14px;border-radius:var(--rad-s);font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;min-height:44px;transition:all .15s}

.live-swap-btn:hover{border-color:var(--acc);color:var(--acc)}
.live-card{background:var(--s2);border:1px solid var(--bdr2);border-left:3px solid var(--acc);border-radius:var(--rad-s);padding:13px 15px;margin-bottom:9px}
.live-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.live-card-train{font-weight:700;font-size:15px;color:var(--tx);font-variant-numeric:tabular-nums}
.live-card-countdown{font-size:13px;color:var(--acc);font-weight:700;white-space:nowrap}

  .day-card,.card,.seg-card,.tabbar,.modal{border:1px solid var(--tx2)}

function isShiftVariant(name){

  const shift = typeof shiftOrName === 'object' && shiftOrName ? shiftOrName : null;
  const name = String(shift?.name ?? shiftOrName ?? '').trim();
  if(!name) return '';
  if(isShiftVariant(name)) return IMAGE_BASE + name.replace(/(?:AV|V)$/,'') + '.jpeg';

// SUPABASE REST API (no CDN required)

const SB = SUPABASE_URL.replace(/\/+$/, '');
const SB_H = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};
async function sbFetch(path, opts){
  const r = await fetch(SB + path, {...opts, headers:{...SB_H,...(opts&&opts.headers||{})}});
  if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,120)); }
  return r.headers.get('content-length')==='0'||r.status===204 ? null : r.json();
}
async function loadRemote(){
  const data = await sbFetch('/rest/v1/app_data?select=key,value');
  const map = {};
  (data||[]).forEach(r => map[r.key] = r.value);
  ST.shifts = (map.shifts && map.shifts.length) ? map.shifts : [];
  ST.segments = map.segments || [];
  ST.exceptions = map.exceptions || {};
  ST.commuteConfig = map.commute_config || null;
  buildShiftMap();
}
// ── 寫入密碼管理 ──────────────────────────────
const _WTK = 'rw_write_token';
function _getWT(){ return localStorage.getItem(_WTK); }
function _saveWT(t){ localStorage.setItem(_WTK, t); }
function _clearWT(){ localStorage.removeItem(_WTK); }
let _wtResolve = null;
function _requireWT(){
  const t = _getWT();
  if(t) return Promise.resolve(t);
  return new Promise(resolve => {
    _wtResolve = resolve;
    setModal('管理員驗證',
      `<div class="fg"><label class="fl">寫入密碼</label>
       <input class="fi" type="password" id="wtInput" placeholder="請輸入密碼" autocomplete="current-password" style="font-size:16px"></div>`,
      [{label:'取消',cls:'btn-secondary',fn:'closeM()'},{label:'確認',cls:'btn-primary',fn:'_confirmWT()'}]
    );
    setTimeout(()=>document.getElementById('wtInput')?.focus(),100);
  });
}
window._confirmWT = function(){
  const val = (document.getElementById('wtInput')?.value||'').trim();
  if(!val) return;
  _saveWT(val); closeM();
  if(_wtResolve){ _wtResolve(val); _wtResolve=null; }
};
async function dbSet(key, value){
  const token = await _requireWT();
  const res = await fetch(SB + '/functions/v1/write-data', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'X-Write-Token': token },
    body: JSON.stringify({key, value})
  });
  if(!res.ok){
    if(res.status === 401){ _clearWT(); throw new Error('管理員密碼已失效，請重新整理頁面'); }
    const t = await res.text();
    throw new Error(res.status+' '+t.slice(0,120));
  }
}
async function initDB(){
  // Step 1: Always load local first — app is usable immediately
  loadLocal();
  // Step 2: If Supabase configured, try to sync in background
  if(SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
  try{
    const timeout = new Promise((_,rej) => setTimeout(()=>rej(new Error('逾時')), 6000));
    await Promise.race([loadRemote(), timeout]);
    dbReady = true; setStatus(true);
    // Refresh UI with remote data
    renderHome(); renderCal();
  }catch(e){
    console.warn('Supabase failed:', e.message);
    setStatus(false);
  }
}
function setStatus(on){
  try{
    const dot=document.getElementById('statusDot');
    if(dot){
      dot.className='dot'+(on?' on':'');
      dot.title = on ? '已連線' : '本地模式';
    }
  }catch(e){}
}
async function pushShifts(){
  buildShiftMap();
  saveLocal();
  if(!dbReady) return;
  try{ await dbSet('shifts', ST.shifts); }catch(e){ console.error('pushShifts:', e.message); }
}
async function pushSegments(){
  saveLocal();
  if(!dbReady) return;
  try{ await dbSet('segments', ST.segments); }catch(e){ console.error('pushSegments:', e.message); }
}
async function pushException(ds, data){
  if(data) ST.exceptions[ds] = data; else delete ST.exceptions[ds];
  saveLocal();
  if(!dbReady) return;
  try{ await dbSet('exceptions', ST.exceptions); }catch(e){ console.error('pushException:', e.message); }
}
async function pushCommuteConfig(){
  saveLocal();
  if(!dbReady) return;
  try{ await dbSet('commute_config', ST.commuteConfig); }catch(e){ console.error('pushCommuteConfig:', e.message); }
}
function loadLocal(){
  setStatus(false);
  try{
    const sh=localStorage.getItem('rw2_shifts'); ST.shifts=sh?JSON.parse(sh):[];
    const seg=localStorage.getItem('rw2_segments'); ST.segments=seg?JSON.parse(seg):[];
    const ex=localStorage.getItem('rw2_exceptions'); ST.exceptions=ex?JSON.parse(ex):{};
    const cc=localStorage.getItem('rw2_commute_config'); ST.commuteConfig=cc?JSON.parse(cc):null;
  }catch{ ST.shifts=[]; }
  buildShiftMap();
}
function saveLocal(){
  try{
    localStorage.setItem('rw2_shifts',JSON.stringify(ST.shifts));
    localStorage.setItem('rw2_segments',JSON.stringify(ST.segments));
    localStorage.setItem('rw2_exceptions',JSON.stringify(ST.exceptions));
    localStorage.setItem('rw2_commute_config',JSON.stringify(ST.commuteConfig));
  }catch{}
}

// DATE UTILS
// ══════════════════════════════════════════════
const p2=n=>String(n).padStart(2,'0');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
const WD=['日','一','二','三','四','五','六'];
function wd(ds){ return WD[new Date(ds+'T00:00:00').getDay()]; }
function fmtDate(ds){ const[y,m,d]=ds.split('-'); return `${y}/${m}/${d}（${wd(ds)}）`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function fmt(t){ return t||'—'; }

function getDayInfo(ds){
  if(ST.exceptions[ds]) return {...ST.exceptions[ds],isEx:true};
  const seg=ST.segments
    .filter(s=>s.startDate<=ds&&(!s.endDate||s.endDate>=ds))
    .sort((a,b)=>b.startDate.localeCompare(a.startDate))[0];
  if(!seg) return {type:'unknown'};
  if(seg.type==='standby'){
    const d=seg.standbyData?.[ds];
    return d?{type:'standby',...d,segId:seg.id}:{type:'standby',shiftId:null,segId:seg.id};
  }
  if(!seg.cycle?.length) return {type:'unknown'};
  const i=diffDays(seg.startDate,ds)%seg.cycle.length;
  return i>=0?{...seg.cycle[Math.max(0,i)]}:{type:'unknown'};
}
function buildShiftMap(){
  ST._shiftMap = {};
  ST.shifts.forEach(s=>{ ST._shiftMap[s.id]=s; });
}
function getShift(id){ return ST._shiftMap?ST._shiftMap[id]:ST.shifts.find(s=>s.id===id); }

const TC={work:'work',off:'off',rest:'rest',leave:'leave',standby:'standby',unknown:''};

    if(tEl&&sg) sg.style.display=(tEl.value==='work'||tEl.value==='standby')?'':'none';

    // If sid exists in DB: show dropdown, uncheck custom
    const el=document.getElementById('exS');
    const cb=document.getElementById('exCustomShift');
    const cv=document.getElementById('exCustomShiftVal');
    if(sid&&getShift(sid)){
      if(el) el.value=sid;
      if(cb){ cb.checked=false; }
      if(cv) cv.style.display='none';
      if(el) el.style.display='';
    } else if(sid&&!getShift(sid)){
      // custom shift id
      if(cb){ cb.checked=true; }
      if(cv){ cv.style.display=''; cv.value=sid; }
      if(el) el.style.display='none';
    } else {
      // no sid at all - default: dropdown visible, custom unchecked
      if(cb){ cb.checked=false; }
      if(cv) cv.style.display='none';
      if(el){ el.style.display=''; }

function renderCal(){
  document.getElementById('calTitle').textContent=`${calY}年${calM}月`;
  const days=daysInMonth(calY,calM), first=new Date(calY,calM-1,1).getDay(), today=todayStr();
  let h=['日','一','二','三','四','五','六'].map(w=>`<div class="cal-hd">${w}</div>`).join('');
  const prevDays=daysInMonth(calM===1?calY-1:calY,calM===1?12:calM-1);
  for(let i=0;i<first;i++) h+=`<div class="cal-cell empty"><div class="cc-day">${prevDays-first+1+i}</div></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${calY}-${p2(calM)}-${p2(d)}`;
    const info=getDayInfo(ds), sh=info.shiftId?getShift(info.shiftId):null;
    const cls=TC[info.type]||'';
    const shiftName=sh?sh.name:(info.type==='work'&&info.shiftId?info.shiftId:'');
    const typeLbl=info.type==='off'?'例假':info.type==='rest'?'休班':info.type==='leave'?'特休':info.type==='standby'?'備勤':'';
    h+=`<div class="cal-cell ${cls} ${ds===today?'today':''}" onclick="goToDate('${ds}')" style="cursor:pointer">
      ${info.isEx?'<div class="cc-ex"></div>':''}
      <div class="cc-day">${d}</div>
      ${shiftName?`<div class="cc-shift">${shiftName}</div>`:typeLbl?`<div class="cc-type">${typeLbl}</div>`:''}
      ${cls?'<div class="cc-dot"></div>':''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML=h;
}
function calcLeaveStats(){
  const thisYear=new Date().getFullYear();
  let leaveCount=0;
  let d2=new Date(`${thisYear}-01-01T00:00:00`);
  const endD=new Date(`${thisYear}-12-31T00:00:00`);
  while(d2<=endD){
    const ds2=`${d2.getFullYear()}-${p2(d2.getMonth()+1)}-${p2(d2.getDate())}`;
    if(getDayInfo(ds2).type==='leave') leaveCount++;
    d2.setDate(d2.getDate()+1);
  }
  const lcEl=document.getElementById('leaveCount');
  const lyEl=document.getElementById('leaveYear');
  if(lcEl) lcEl.textContent=leaveCount;
  if(lyEl) lyEl.textContent=`（${thisYear} 年度）`;
}
function calMove(dir){ calM+=dir; if(calM>12){calM=1;calY++;}else if(calM<1){calM=12;calY--;} renderCal(); _slideIn(document.getElementById('calGrid'),dir); }
function subscribeCalendar(){
  window.open('webcal://oqyjixphmdrhcmomskth.supabase.co/functions/v1/calendar','_blank');
}
function toggleCalDrop(){
  const drop=document.getElementById('calMonthDrop');
  if(drop.classList.contains('open')){drop.classList.remove('open');return;}
  const now=new Date(), ty=now.getFullYear(), tm=now.getMonth()+1;
  drop.innerHTML=[0,1,2,3].map(o=>{
    let y=ty,m=tm+o;
    if(m>12){m-=12;y++;}else if(m<1){m+=12;y--;}
    return `<div class="cal-month-opt" onclick="jumpCalTo(${y},${m})">${y} 年 ${m} 月</div>`;
  }).join('');
  drop.classList.add('open');
}
function jumpCalTo(y,m){calY=y;calM=m;renderCal();document.getElementById('calMonthDrop').classList.remove('open');}
document.addEventListener('click',e=>{
  const drop=document.getElementById('calMonthDrop');
  if(drop&&!drop.contains(e.target)&&e.target.id!=='calTitle'){drop.classList.remove('open');}
});
function goToDate(ds){
  const today=todayStr();
  const offset=diffDays(today,ds);
  // 直接切換頁面，不透過 showPage 避免 homeOffset 被重置
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-home').classList.add('active');
  document.querySelectorAll('.nav-tab')[0]?.classList.add('active');
  const dir=0-_pageIdx; _pageIdx=0;
  if(dir!==0) _slideIn(document.getElementById('page-home'),dir);
  requestAnimationFrame(_moveTabLens);
  homeOffset=offset;
  renderHome();
}

function _irmOnFile(input){
  const file=input.files[0]; if(!file) return;
  document.getElementById('irmFileName').textContent=file.name;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
      const defs=[{name:'AB組',row:3,len:50},{name:'CD組',row:4,len:50},{name:'E組',row:5,len:20},{name:'F組',row:6,len:20}];
      const groups={};
      for(const g of defs){
        const rd=rows[g.row]; if(!rd) continue;
        const raw=rd.slice(2,2+g.len);
        groups[g.name]={refCycle:[raw[g.len-1],...raw.slice(0,g.len-1)],len:g.len};
      }
      if(!Object.keys(groups).length){toast('找不到輪職資料，請確認格式','err');return;}
      _irmData=groups;
      document.getElementById('irmGroupBtns').innerHTML=Object.keys(groups).map(n=>
        `<button class="filter-btn" onclick="_irmSelectGroup('${escapeHtml(n)}')">${escapeHtml(n)}</button>`
      ).join('');
      document.getElementById('irmGroupSec').style.display='';
    }catch(err){toast('Excel 解析失敗：'+err.message,'err');}
  };
  reader.readAsBinaryString(file);
}

function _irmSelectGroup(name){
  _irmGroup=name;
  document.querySelectorAll('#irmGroupBtns .filter-btn').forEach(b=>b.classList.toggle('active',b.textContent===name));
  document.getElementById('irmDateSec').style.display='';
  const s=document.getElementById('irmStart'); if(s&&!s.value)s.value=todayStr();
  _irmDateChanged();
}

function _irmDateChanged(){
  const sd=document.getElementById('irmStart')?.value;
  if(!sd||!_irmGroup||!_irmData?.[_irmGroup]) return;
  const {refCycle,len}=_irmData[_irmGroup];
  const computed=((diffDays(_IRM_REF,sd)%len)+len)%len;
  _irmPopulatePosDropdown(refCycle,len,computed);
  _irmPreview();
}

function _irmPopulatePosDropdown(refCycle,len,selectedOffset){
  const TL={off:'例假',rest:'休班',leave:'特休'};
  const el=document.getElementById('irmCyclePos'); if(!el) return;
  el.innerHTML=refCycle.map((v,i)=>{
    const it=_irmToCycleItem(v);
    const lbl=it.type==='work'?`${it.shiftId} 次`:(TL[it.type]||'休班');
    return `<option value="${i}"${i===selectedOffset?' selected':''}> 第 ${i+1} 天 — ${lbl}</option>`;
  }).join('');
  document.getElementById('irmPosSec').style.display='';
}

function _irmToCycleItem(val){
  if(val==='例假') return {type:'off'};
  if(val==='休'||val==='—'||val==null) return {type:'rest'};
  if(typeof val==='number') return {type:'work',shiftId:String(Math.round(val))};
  if(typeof val==='string'&&/^\d+$/.test(val.trim())) return {type:'work',shiftId:val.trim()};
  return {type:'rest'};
}

function _irmPreview(){
  const sd=document.getElementById('irmStart')?.value;
  const posEl=document.getElementById('irmCyclePos');
  const pv=document.getElementById('irmPreview');
  if(!sd||!_irmGroup||!_irmData?.[_irmGroup]||!posEl){if(pv)pv.style.display='none';return;}
  const {refCycle,len}=_irmData[_irmGroup];
  const offset=parseInt(posEl.value)||0;
  const rot=[...refCycle.slice(offset),...refCycle.slice(0,offset)];
  const TL={off:'例假',rest:'休班',leave:'特休'};
  const TC={off:'var(--r)',rest:'var(--g)',work:'var(--acc)',leave:'var(--b)'};
  document.getElementById('irmPreviewBody').innerHTML=Array.from({length:10},(_,i)=>{
    const ds=addDays(sd,i);
    const it=_irmToCycleItem(rot[i]);
    const lbl=it.type==='work'?it.shiftId:(TL[it.type]||'');
    return `<div style="display:flex;gap:10px;align-items:center;padding:2px 0">
      <span style="color:var(--tx3);min-width:70px;font-variant-numeric:tabular-nums">${ds.slice(5)}（${wd(ds)}）</span>
      <span style="color:${TC[it.type]||'var(--tx)'};font-weight:${it.type==='work'?'600':'400'}">${lbl}</span>
    </div>`;
  }).join('');
  if(pv)pv.style.display='';
  const b=document.querySelector('#modalActions .btn-primary');if(b)b.disabled=false;
}

function _irmConfirm(){
  const sd=document.getElementById('irmStart')?.value;
  const ed=document.getElementById('irmEnd')?.value||null;
  const posEl=document.getElementById('irmCyclePos');
  if(!sd){toast('請輸入開始日期','err');return;}
  if(!_irmGroup||!_irmData?.[_irmGroup]){toast('請選擇組別','err');return;}
  const {refCycle,len}=_irmData[_irmGroup];
  const offset=parseInt(posEl?.value)||0;
  const rot=[...refCycle.slice(offset),...refCycle.slice(0,offset)];
  ST.segments.push({id:'seg_'+Date.now(),type:'normal',startDate:sd,endDate:ed,cycle:rot.map(_irmToCycleItem),standbyData:{}});
  pushSegments().then(()=>{renderSegs();closeM();toast(`${_irmGroup} 循環段已新增（${len} 天）`,'ok');});
}

function sortShifts(arr){
  return [...arr].sort((a,b)=>{
    // Extract numeric prefix and suffix
    const parse=name=>{
      const m=name.match(/^(\d+)(.*)/);
      return m?[parseInt(m[1]),m[2]]:[9999,name];
    };
    const [an,as]=parse(a.name), [bn,bs]=parse(b.name);
    if(an!==bn) return an-bn;
    // Same number: base shift before variants (no suffix < AV < V < others)
    const rank=s=>s===''?0:s==='AV'?1:s==='V'?2:3;
    return rank(as)-rank(bs)||as.localeCompare(bs);
  });
}
function renderShifts(){

  if(!TRA_STATIONS.includes(from)){ toast(`找不到站名「${from}」，請從清單選擇`,'err'); return; }
  if(!TRA_STATIONS.includes(to)){ toast(`找不到站名「${to}」，請從清單選擇`,'err'); return; }
  if(isNaN(buf)||buf<0||buf>60){ toast('上班緩衝需在 0-60 分之間','err'); return; }
  if(isNaN(early)||early<0||early>120){ toast('下班可提早需在 0-120 分之間','err'); return; }

}

// ══════════════════════════════════════════════
// TDX 車次自動查詢（工作班 Modal 內）
// ══════════════════════════════════════════════
let _tdxCands = [];
let _tdxMode  = 'before';
function _hm2min(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function _adjustTime(t, deltaMin){
  let total=_hm2min(t)+deltaMin;
  total=((total%1440)+1440)%1440;
  return p2(Math.floor(total/60))+':'+p2(total%60);
}
function _tomorrowISO(){
  const d=new Date(); d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function _shortTrainType(t){ return (t||'').replace(/\(.*\)/,'').trim(); }

function openTdxPicker(mode){
  const c = getCommuteConfig();
  if(!c.fromStation || !c.toStation){
    toast('請先在工作班頁面設定通勤資訊','err'); return;
  }
  const startTime = document.getElementById('est')?.value;
  const endTime   = document.getElementById('eet')?.value;
  const baseTime  = mode==='before' ? startTime : endTime;
  if(!baseTime){
    toast(mode==='before'?'請先填上班時間':'請先填下班時間','err'); return;
  }
  _tdxMode = mode;
  const threshold = _adjustTime(baseTime, mode==='before' ? -c.bufferMin : -c.earlyMin);
  const date = _tomorrowISO();
  const fromSt = mode==='before' ? c.fromStation : c.toStation;
  const toSt   = mode==='before' ? c.toStation   : c.fromStation;

  document.getElementById('tdxPickerTitle').textContent =
    mode==='before' ? `🚆 查上班車　${fromSt} → ${toSt}` : `🚆 查下班車　${fromSt} → ${toSt}`;
  document.getElementById('tdxPickerBody').innerHTML =
    '<div style="text-align:center;padding:20px;color:var(--tx3);font-size:13px">查詢中…</div>';
  document.getElementById('tdxPicker').classList.add('open');

  fetch(SUPABASE_URL+'/functions/v1/tdx-search', {
    method:'POST',
    headers:{
      'Authorization':'Bearer '+SUPABASE_ANON_KEY,
      'Content-Type':'application/json',
    },
    body:JSON.stringify({
      fromStation:fromSt, toStation:toSt,
      mode, time:threshold, date,
      trainTypes:c.trainTypes
    })
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.error){
      document.getElementById('tdxPickerBody').innerHTML =
        `<div style="color:var(--r);padding:16px;text-align:center;font-size:13px">查詢失敗：${data.error}</div>`;
      return;
    }
    _renderTdxResults(data, baseTime);
  })
  .catch(e=>{
    document.getElementById('tdxPickerBody').innerHTML =
      `<div style="color:var(--r);padding:16px;text-align:center;font-size:13px">查詢失敗：${e.message}</div>`;
  });
}

function _renderTdxResults(data, baseTime){
  _tdxCands = data.candidates || [];
  if(!_tdxCands.length){
    document.getElementById('tdxPickerBody').innerHTML =
      '<div style="padding:16px;text-align:center;color:var(--tx3);font-size:13px">查無符合車次<br><span style="font-size:11px">（請檢查車種設定或站名是否正確）</span></div>';
    return;
  }
  const baseMin = _hm2min(baseTime);
  const rows = _tdxCands.map((c,i)=>{
    let badge='';
    if(_tdxMode==='before'){
      const arrMin = _hm2min(c.arrivalTime);
      const earlyMin = baseMin - arrMin;
      if(i===0) badge=`<span style="color:var(--acc);font-weight:700">推薦</span>　<span style="color:var(--tx3)">提早 ${earlyMin} 分抵達</span>`;
      else badge=`<span style="color:var(--tx3)">提早 ${earlyMin} 分抵達</span>`;
    } else {
      const depMin = _hm2min(c.departureTime);
      if(depMin < baseMin) badge = `<span style="color:var(--cyan);font-weight:700">可提早 ${baseMin-depMin} 分下班</span>`;
      else if(depMin === baseMin) badge = '<span style="color:var(--acc);font-weight:700">準點下班</span>';
      else badge = `<span style="color:var(--tx3)">${depMin-baseMin} 分後出發</span>`;
    }
    const t = _shortTrainType(c.trainType);
    return `
      <button class="tdx-pick" onclick="applyTdxPick(${i})">
        <div class="tdx-pick-main">${t} ${c.trainNo}　${c.departureTime} → ${c.arrivalTime}</div>
        <div class="tdx-pick-sub">${badge}</div>
      </button>`;
  }).join('');
  document.getElementById('tdxPickerBody').innerHTML = `
    <div style="font-size:11px;color:var(--tx3);margin-bottom:10px">${data.from.name} → ${data.to.name}　${data.date}</div>
    <div style="display:flex;flex-direction:column;gap:7px">${rows}</div>
  `;
}

function applyTdxPick(idx){
  const c = _tdxCands[idx];
  if(!c) return;
  // 只填搭車時間，「首班/末班車次」是 Stan 實際駕駛的工作車次，與通勤無關，不可覆寫
  if(_tdxMode==='before') document.getElementById('ebt').value = c.departureTime;
  else                    document.getElementById('eat').value = c.departureTime;
  closeTdxPicker();
  toast(`已套用 ${_shortTrainType(c.trainType)} ${c.trainNo} ${c.departureTime}`,'ok');
}

function closeTdxPicker(){
  document.getElementById('tdxPicker').classList.remove('open');
}
function tdxPickerOverlayClick(e){
  if(e.target.id==='tdxPicker') closeTdxPicker();
}

// ══════════════════════════════════════════════
// TDX 批次重抓全部工作班搭車時間
// ══════════════════════════════════════════════
let _tdxBatchResults = [];
let _tdxBatchCancelled = false;
let _tdxBatchPicks = new Set();
function _sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function _tdxBatchCancel(){ _tdxBatchCancelled = true; }

async function _tdxBatchFetchAll(c, mode, date){
  // 抓該方向「全日」時刻表（mode='before' time=23:59；mode='after' time=00:00）
  const fromSt = mode==='before' ? c.fromStation : c.toStation;
  const toSt   = mode==='before' ? c.toStation   : c.fromStation;
  const time   = mode==='before' ? '23:59' : '00:00';
  const res = await fetch(SUPABASE_URL+'/functions/v1/tdx-search', {
    method:'POST',
    headers:{
      'Authorization':'Bearer '+SUPABASE_ANON_KEY,
      'Content-Type':'application/json',
    },
    body:JSON.stringify({
      fromStation:fromSt, toStation:toSt, mode, time, date,
      trainTypes:c.trainTypes, limit:0
    })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

function _pickBefore(list, arriveBy){
  // list 已依出發時間從晚到早排序；找第一筆抵達 ≤ arriveBy 的車（即「最後一班能準時到」）
  const arriveMin = _hm2min(arriveBy);
  return list.find(c => _hm2min(c.arrivalTime) <= arriveMin) || null;
}
function _pickAfter(list, departAfter){
  // list 已依出發時間從早到晚排序；找第一筆出發 ≥ departAfter 的車（即「最早能搭」）
  const depMin = _hm2min(departAfter);
  return list.find(c => _hm2min(c.departureTime) >= depMin) || null;
}

async function openTdxBatch(){
  const c = getCommuteConfig();
  if(!c.fromStation || !c.toStation){
    toast('請先設定通勤資訊','err'); return;
  }
  if(!ST.shifts.length){ toast('沒有工作班可更新','err'); return; }

  _tdxBatchCancelled = false;
  _tdxBatchResults = [];
  setModal('🔄 全部重抓台鐵時刻', `
    <div style="font-size:13px;color:var(--tx2);margin-bottom:8px">
      只需向 TDX 查詢兩次（上行 + 下行全日時刻表），所有班次的搭車時間在前端計算。
    </div>
    <div id="tdxBatchProgress" style="font-variant-numeric:tabular-nums;font-size:13px;color:var(--tx);padding:10px;background:var(--s2);border-radius:var(--rad-s)">準備中…</div>
  `, [{label:'取消',cls:'btn-secondary',fn:'_tdxBatchCancel()'}], true);

  const date = _tomorrowISO();
  let beforeList = null, afterList = null;

  try {
    const prog = document.getElementById('tdxBatchProgress');
    if(prog) prog.textContent = `(1/2) 查詢 ${c.fromStation} → ${c.toStation} 全日時刻表…`;
    const r1 = await _tdxBatchFetchAll(c, 'before', date);
    beforeList = r1.candidates || [];
    if(_tdxBatchCancelled){ closeM(); toast('已取消','err'); return; }

    // 兩次查詢間留 800ms，避免 TDX 速率限制（免費版 5 次/分）
    await _sleep(800);

    if(prog) prog.textContent = `(2/2) 查詢 ${c.toStation} → ${c.fromStation} 全日時刻表…`;
    const r2 = await _tdxBatchFetchAll(c, 'after', date);
    afterList = r2.candidates || [];
  } catch(e) {
    closeM();
    toast('查詢失敗：'+e.message,'err');
    return;
  }

  if(_tdxBatchCancelled){ closeM(); toast('已取消','err'); return; }

  // 在記憶體中對每個班次挑最佳車
  for(const s of ST.shifts){
    if(s.startTime){
      const arriveBy = _adjustTime(s.startTime, -c.bufferMin);
      const best = _pickBefore(beforeList, arriveBy);
      _tdxBatchResults.push({
        shiftId: s.id, shiftName: s.name, mode: 'before',
        oldTime: s.boardTime || '', oldTrain: s.depTrain || '',
        newTime: best?.departureTime || '', newTrain: best?.trainNo || '',
        error: null
      });
    }
    if(s.endTime){
      const departAfter = _adjustTime(s.endTime, -c.earlyMin);
      const best = _pickAfter(afterList, departAfter);
      _tdxBatchResults.push({
        shiftId: s.id, shiftName: s.name, mode: 'after',
        oldTime: s.alightTime || '', oldTrain: s.arrTrain || '',
        newTime: best?.departureTime || '', newTrain: best?.trainNo || '',
        error: null
      });
    }
  }

  _renderTdxBatchDiff();
}

function _hasChange(r){
  if(r.error) return false;
  if(!r.newTime) return false;
  // 只比對時間（車次號不存到 shift，不參與變動判斷）
  return r.newTime !== r.oldTime;
}

function _renderTdxBatchDiff(){
  const results = _tdxBatchResults;
  if(!results.length){ closeM(); toast('沒有可比對的資料','err'); return; }

  _tdxBatchPicks = new Set();
  results.forEach((r,i)=>{ if(_hasChange(r)) _tdxBatchPicks.add(i); });

  const rows = results.map((r,i)=>{
    const changed = _hasChange(r);
    const cls = r.error ? 'tdx-row-err' : (changed ? 'tdx-row-chg' : 'tdx-row-same');
    const label = r.mode === 'before' ? '上班' : '下班';
    const checked = _tdxBatchPicks.has(i) ? 'checked' : '';
    const disabled = (r.error || (!r.newTime && !r.newTrain)) ? 'disabled' : '';
    const oldStr = r.oldTime ? r.oldTime : '<span style="color:var(--tx3)">未設定</span>';
    let newStr;
    if(r.error) newStr = `<span style="color:var(--r)">${String(r.error).slice(0,40)}</span>`;
    else if(!r.newTime) newStr = '<span style="color:var(--tx3)">查無車次</span>';
    else newStr = `${r.newTime}${r.newTrain?` <span style="color:var(--tx3);font-size:11px">(${r.newTrain})</span>`:''}`;
    return `
      <tr class="${cls}">
        <td style="text-align:center"><input type="checkbox" data-idx="${i}" ${checked} ${disabled} onchange="_tdxBatchToggle(${i})"></td>
        <td><b style="color:var(--tx)">${r.shiftName}</b></td>
        <td>${label}</td>
        <td style="font-variant-numeric:tabular-nums">${oldStr}</td>
        <td style="font-variant-numeric:tabular-nums">${newStr}</td>
      </tr>`;
  }).join('');

  const changedCount = results.filter(_hasChange).length;
  const errCount = results.filter(r=>r.error).length;

  setModal('🔄 台鐵時刻對照結果', `
    <div style="font-size:12px;color:var(--tx2);margin-bottom:10px">
      共 <b style="color:var(--tx)">${results.length}</b> 項查詢，
      <b style="color:var(--cyan)">${changedCount}</b> 項有變動（預設已勾選）
      ${errCount?`，<b style="color:var(--r)">${errCount}</b> 項失敗`:''}。
    </div>
    <div style="overflow:auto;max-height:55vh;border:1px solid var(--bdr);border-radius:var(--rad-s)">
      <table class="tdx-diff-table">
        <thead><tr>
          <th style="width:50px;text-align:center"><input type="checkbox" id="tdxBatchHeadCb" onchange="_tdxBatchToggleAll()" title="全選 / 取消全選" style="cursor:pointer"></th>
          <th>班號</th>
          <th>方向</th>
          <th>舊搭車時間</th>
          <th>新搭車時間（車次參考）</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `, [
    {label:'取消',cls:'btn-secondary',fn:'closeM()'},
    {label:'套用勾選',cls:'btn-primary',fn:'_applyTdxBatch()'},
  ], true);
  _updateBatchHeadCb();
}

function _validBatchIndices(){
  const out = [];
  _tdxBatchResults.forEach((r,i)=>{
    if(!r.error && (r.newTime || r.newTrain)) out.push(i);
  });
  return out;
}
function _updateBatchHeadCb(){
  const head = document.getElementById('tdxBatchHeadCb');
  if(!head) return;
  const valids = _validBatchIndices();
  if(!valids.length){ head.checked=false; head.indeterminate=false; head.disabled=true; return; }
  head.disabled=false;
  const checkedCount = valids.filter(i=>_tdxBatchPicks.has(i)).length;
  if(checkedCount === 0){ head.checked=false; head.indeterminate=false; }
  else if(checkedCount === valids.length){ head.checked=true; head.indeterminate=false; }
  else { head.checked=false; head.indeterminate=true; }
}
function _tdxBatchToggleAll(){
  const valids = _validBatchIndices();
  const allChecked = valids.length>0 && valids.every(i=>_tdxBatchPicks.has(i));
  if(allChecked) valids.forEach(i=>_tdxBatchPicks.delete(i));
  else valids.forEach(i=>_tdxBatchPicks.add(i));
  valids.forEach(i=>{
    const cb = document.querySelector(`input[type=checkbox][data-idx="${i}"]`);
    if(cb) cb.checked = _tdxBatchPicks.has(i);
  });
  _updateBatchHeadCb();
}

function _tdxBatchToggle(i){
  if(_tdxBatchPicks.has(i)) _tdxBatchPicks.delete(i);
  else _tdxBatchPicks.add(i);
  _updateBatchHeadCb();
}

function _applyTdxBatch(){
  if(!_tdxBatchPicks.size){ toast('沒有勾選任何項目','err'); return; }
  const picks = [..._tdxBatchPicks].map(i=>_tdxBatchResults[i]).filter(r=>r && !r.error);
  if(!picks.length){ toast('勾選項目皆無效','err'); return; }

  // 只更新搭車時間，不動「首班/末班車次」（那是工作駕駛的車次）
  const updates = {};
  for(const r of picks){
    if(!updates[r.shiftId]) updates[r.shiftId] = {};
    if(r.mode === 'before') updates[r.shiftId].boardTime  = r.newTime;
    else                    updates[r.shiftId].alightTime = r.newTime;
  }
  ST.shifts = ST.shifts.map(s => updates[s.id] ? { ...s, ...updates[s.id] } : s);
  pushShifts().then(()=>{
    closeM();
    renderShifts();
    toast(`已套用 ${picks.length} 項變更`,'ok');
  });
}

let _liveFrom = '';
let _liveTo = '';
let _liveResults = [];
let _liveLoading = false;
let _liveTimer = null;

function showLiveTrain(){
  _updateLivePills();
  _renderLiveResults();
  _startLiveTimer();
}

function _selectLiveFrom(s){
  if(_liveFrom === s) return;
  if(_liveTo === s) _liveTo = '';   // 防呆：起站選到跟迄站一樣 → 清掉迄站
  _liveFrom = s;
  _liveResults = [];
  _updateLivePills();
  _renderLiveResults();
}
function _selectLiveTo(s){
  if(_liveTo === s) return;
  if(_liveFrom === s) _liveFrom = '';
  _liveTo = s;
  _liveResults = [];
  _updateLivePills();
  _renderLiveResults();
}
function _swapLiveOD(){
  if(!_liveFrom && !_liveTo) return;
  [_liveFrom, _liveTo] = [_liveTo, _liveFrom];
  _liveResults = [];
  _updateLivePills();
  _renderLiveResults();
}

function _updateLivePills(){
  const fromRow = document.getElementById('liveFromRow');
  const toRow = document.getElementById('liveToRow');
  if(!fromRow || !toRow) return;
  fromRow.querySelectorAll('.live-pill').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.st === _liveFrom);
  });
  toRow.querySelectorAll('.live-pill').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.st === _liveTo);
  });
  const qb = document.getElementById('liveQueryBtn');
  if(qb) qb.disabled = !_liveFrom || !_liveTo || _liveFrom === _liveTo || _liveLoading;
}

async function _queryLive(){
  if(!_liveFrom || !_liveTo){ toast('請先選擇起訖站','err'); return; }
  if(_liveFrom === _liveTo){ toast('起訖站不能相同','err'); return; }
  _liveLoading = true;
  _updateLivePills();
  const resEl = document.getElementById('liveResults');
  resEl.innerHTML = '<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">查詢中…</div>';

  const now = new Date();
  const time = p2(now.getHours())+':'+p2(now.getMinutes());
  const date = now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate());

  try {
    const res = await fetch(SUPABASE_URL+'/functions/v1/tdx-search', {
      method:'POST',
      headers:{
        'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json',
      },
      body:JSON.stringify({
        fromStation:_liveFrom, toStation:_liveTo,
        mode:'after', time, date, limit:5, includeDelay:true
      })
    });
    const data = await res.json();
    if(data.error){
      resEl.innerHTML = `<div style="text-align:center;padding:18px;color:var(--r);font-size:13px">查詢失敗：${data.error}</div>`;
      _liveResults = [];
    } else {
      _liveResults = data.candidates || [];
      _renderLiveResults();
    }
  } catch(e){
    resEl.innerHTML = `<div style="text-align:center;padding:18px;color:var(--r);font-size:13px">查詢失敗：${e.message}</div>`;
  }
  _liveLoading = false;
  _updateLivePills();
}

function _renderLiveResults(){
  const el = document.getElementById('liveResults');
  if(!el) return;
  if(!_liveResults.length){
    if(!_liveFrom || !_liveTo || _liveFrom === _liveTo){
      el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">請選擇起訖站後按「🔄 查詢」</div>';
    } else {
      el.innerHTML = '';
    }
    return;
  }
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  // 過了現在時間的車自動移除
  _liveResults = _liveResults.filter(c => _hm2min(c.departureTime) >= nowMin);
  if(!_liveResults.length){
    el.innerHTML = '<div style="text-align:center;padding:18px;color:var(--tx3);font-size:13px">無未來車次，請按「🔄 查詢」重新查詢</div>';
    return;
  }
  el.innerHTML = _liveResults.map(c => {
    const depMin = _hm2min(c.departureTime);
    const arrMin = _hm2min(c.arrivalTime);
    const dur = arrMin - depMin;
    const remaining = depMin - nowMin;
    const cdText = remaining === 0 ? '即將發車' : `${remaining} 分後發車`;
    let delayBadge = '';
    if(typeof c.delayMin === 'number'){
      delayBadge = c.delayMin > 0
        ? ` <span class="live-card-delay">誤點 ${c.delayMin} 分</span>`
        : ` <span class="live-card-ontime">準點</span>`;
    }
    return `
      <div class="live-card">
        <div class="live-card-head">
          <div class="live-card-train">${_shortTrainType(c.trainType)} ${c.trainNo}${delayBadge}</div>
          <div class="live-card-countdown">${cdText}</div>
        </div>
        <div class="live-card-times">
          ${c.departureTime}<span class="live-card-arrow">→</span>${c.arrivalTime}
          <span class="live-card-dur">行車 ${dur} 分</span>
        </div>
      </div>`;
  }).join('');
}

function _startLiveTimer(){
  if(_liveTimer) clearInterval(_liveTimer);
  _liveTimer = setInterval(()=>{
    const active = document.getElementById('page-livetrain')?.classList.contains('active');
    if(!active){ clearInterval(_liveTimer); _liveTimer = null; return; }
    _renderLiveResults();
  }, 60000);
}

function openImportXLSX(){
  parsedXLSX=null;
  setModal('匯入 Excel 工作班資料',`
    <div style="font-size:12px;color:var(--tx3);margin-bottom:12px">
      上傳公司提供的 Excel 班表，系統自動讀取上下班時間。<br>
      <b style="color:var(--acc)">上下班搭車時間需自行在工作班編輯中設定，匯入後已設定的搭車時間將保留。</b>
    </div>
    <div class="fg"><label class="fl">選擇 Excel 檔案</label>
      <input type="file" id="xlFile" accept=".xlsx,.xls" style="color:var(--tx2);font-size:13px"></div>
    <div id="xlPrev" style="font-size:12px;color:var(--tx3);margin-top:8px"></div>`,
    [{label:'取消',cls:'btn-secondary',fn:'closeM()'},{label:'確認匯入',cls:'btn-primary',fn:'doImport()'}]
  );
  setTimeout(()=>document.getElementById('xlFile').addEventListener('change',parseXLSX),100);
}
function parseXLSX(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let hr=-1;
      for(let i=0;i<rows.length;i++){ if(rows[i].some(c=>String(c).trim()==='工作班')){hr=i;break;} }
      if(hr<0){document.getElementById('xlPrev').textContent='❌ 找不到「工作班」欄位';return;}
      // Build column index map from header row
      const colMap={};
      rows[hr].forEach((h,i)=>{ const k=String(h).trim(); if(k) colMap[k]=i; });
      // Check required columns
      const required=['工作班','上班時間','下班時間'];
      const missing=required.filter(k=>colMap[k]===undefined);
      if(missing.length){document.getElementById('xlPrev').textContent='❌ 找不到欄位：'+missing.join('、');parsedXLSX=null;return;}
      // Map optional columns with fallback aliases
      const ci={
        name:colMap['工作班'],
        startTime:colMap['上班時間'],
        endTime:colMap['下班時間'],
        specialNote:colMap['工作班特定行駛']??colMap['特定行駛']??colMap['備註']??-1,
        depTrain:colMap['上班車次']??-1,
        depTime:colMap['開車時間']??-1,
        arrTrain:colMap['下班車次']??-1,
        arrTime:colMap['到達時間']??-1,
      };
      const toT=v=>{
        if(!v&&v!==0)return '';
        const s=String(v).trim();
        if(s.includes(':')){ const p=s.split(':'); return p[0].padStart(2,'0')+':'+p[1].padStart(2,'0'); }
        if(typeof v==='number'){ const m=Math.round(v*24*60); return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
        return '';
      };
      parsedXLSX=[];
      for(let r=hr+1;r<rows.length;r++){
        const row=rows[r], name=String(row[ci.name]||'').trim();
        if(!name||name==='nan')continue;
        const st=toT(row[ci.startTime]),et=toT(row[ci.endTime]);
        const ex=ST.shifts.find(s=>s.id===name)||{};
        parsedXLSX.push({id:name,name,startTime:st,endTime:et,
          depTrain:ci.depTrain>=0?String(row[ci.depTrain]||'').trim().replace('nan',''):'',
          depTime:ci.depTime>=0?toT(row[ci.depTime]):'',
          arrTrain:ci.arrTrain>=0?String(row[ci.arrTrain]||'').trim().replace('nan',''):'',
          arrTime:ci.arrTime>=0?toT(row[ci.arrTime]):'',
          specialNote:ci.specialNote>=0?String(row[ci.specialNote]||'').trim().replace('nan',''):'',
          isOvernight:false,
          boardTime:ex.boardTime||'',
          alightTime:ex.alightTime||'',
          imageUrl:ex.imageUrl||'',
        });
      }
      if(!parsedXLSX.length){document.getElementById('xlPrev').textContent='❌ 未找到任何有效工作班資料';parsedXLSX=null;return;}
      document.getElementById('xlPrev').textContent=`✅ 解析完成：${parsedXLSX.length} 個工作班，已設定的搭車時間將保留`;
    }catch(err){document.getElementById('xlPrev').textContent='❌ 解析失敗：'+err.message; parsedXLSX=null;}
  };
  reader.readAsArrayBuffer(file);
}
function doImport(){
  if(!parsedXLSX?.length){toast('請先選擇 Excel 檔案','err');return;}
  if(!confirm(`確認匯入 ${parsedXLSX.length} 個工作班？`))return;
  ST.shifts=sortShifts(parsedXLSX); parsedXLSX=null;
  pushShifts().then(()=>{renderShifts();closeM();toast(`已匯入 ${ST.shifts.length} 個工作班`,'ok');});
}

    <div id="csPrev" style="font-size:12px;color:var(--tx3);margin-top:8px"></div>
`,
    [{label:'取消',cls:'btn-secondary',fn:'closeM()'}]
  );
  setTimeout(()=>document.getElementById('csFile').addEventListener('change',parseCheckXLSX),100);

function parseCheckXLSX(e){
  const file=e.target.files[0]; if(!file)return;
  const prev=document.getElementById('csPrev');
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

      // 1. 從前幾列找年月（民國年或西元年）
      let year=null,month=null;
      for(let i=0;i<Math.min(6,rows.length);i++){
        const line=rows[i].map(c=>String(c)).join('');
        const m1=line.match(/(\d{3})年(\d{1,2})月/);
        const m2=line.match(/(\d{4})年(\d{1,2})月/);
        if(m1){year=parseInt(m1[1])+1911;month=parseInt(m1[2]);break;}
        if(m2&&parseInt(m2[1])>1900){year=parseInt(m2[1]);month=parseInt(m2[2]);break;}
      }
      if(!year){
        const fn=file.name;
        const fnm=fn.match(/(\d{3})年?(\d{2})月/);
        if(fnm){year=parseInt(fnm[1])+1911;month=parseInt(fnm[2]);}
        else{year=new Date().getFullYear();month=new Date().getMonth()+1;}
      }

      // 2. 找日期標題列（含最多 1–31 整數的那列）
      let hrIdx=-1,dateColMap={},maxHits=0;
      for(let i=0;i<rows.length;i++){
        const tmp={};
        rows[i].forEach((c,ci)=>{
          const v=typeof c==='number'?c:parseFloat(String(c).trim());
          if(Number.isInteger(v)&&v>=1&&v<=31)tmp[v]=ci;
        });
        if(Object.keys(tmp).length>maxHits){maxHits=Object.keys(tmp).length;hrIdx=i;dateColMap=tmp;}
      }
      if(maxHits<20){prev.textContent='❌ 找不到日期欄位，請確認 Excel 格式';_csData=null;return;}

      // 3. 擷取人員班表（日期標題列之後）
      const maxDay=daysInMonth(year,month);
      const workers=[];
      for(let r=hrIdx+1;r<rows.length;r++){
        const row=rows[r];
        // 姓名可能含換行（name\nid 在同一 cell）
        const rawName=String(row[0]||'').trim();
        if(!rawName)continue;
        const nameParts=rawName.split(/[\n\r]/);
        const name=nameParts[0].trim();
        if(!name)continue;
        // 跳過星期子標題列
        if(/^[日一二三四五六衛接\s]+$/.test(name))continue;
        // 跳過注意事項列（每區塊結尾），繼續讀下一區塊
        if(/^[123][\.\、]|^注意/.test(name))continue;
        // 確認這列有班次資料（不是純 ID 子列）
        let hasData=false;
        for(let d=1;d<=maxDay;d++){
          if(dateColMap[d]!==undefined&&String(row[dateColMap[d]]||'').trim()){hasData=true;break;}
        }
        if(!hasData)continue;
        const id=nameParts[1]?.trim()||String(row[1]||'').trim();
        const days={};
        for(let d=1;d<=maxDay;d++){
          if(dateColMap[d]===undefined)continue;
          days[d]=String(row[dateColMap[d]]||'').trim();
        }
        workers.push({name,id,days});
      }
      if(!workers.length){prev.textContent='❌ 未找到任何人員班表資料';_csData=null;return;}
      _csData={year,month,workers};
      prev.innerHTML=`✅ ${year}年${p2(month)}月，共 ${workers.length} 人`;
      doCheckSchedule();
    }catch(err){
      document.getElementById('csPrev').textContent='❌ 解析失敗：'+err.message;
      _csData=null;
    }
  };
  reader.readAsArrayBuffer(file);
}

function lookupCsWorker(){
  const idVal=document.getElementById('csId').value.trim();
  const el=document.getElementById('csNameResult');
  if(!idVal){el.textContent='';return;}
  const w=_csData?.workers.find(w=>String(w.id).trim()===idVal);
  el.innerHTML=w
    ?`<span style="color:var(--g)">✓ ${w.name}</span>`
    :`<span style="color:var(--r)">查無此員工編號</span>`;
}

function doCheckSchedule(){
  if(!_csData){toast('請先選擇 Excel 檔案','err');return;}
  const worker=_csData.workers.find(w=>String(w.id).trim()==='651692');
  if(!worker){toast('在班表中找不到本人資料','err');return;}
  const {year,month}=_csData;
  const totalDays=daysInMonth(year,month);
  const errors=[];
  const AL={work:'工作班',off:'例假',rest:'休班',leave:'特休',standby:'備勤',unknown:'未知'};

  for(let d=1;d<=totalDays;d++){
    const ds=`${year}-${p2(month)}-${p2(d)}`;
    const xlRaw=(worker.days[d]||'').trim();
    const appInfo=getDayInfo(ds);
    const appType=appInfo.type;

    // 分類 Excel 值
    let xlType,xlShift=null;
    if(!xlRaw||xlRaw==='—'||xlRaw==='-'||xlRaw==='休')xlType='rest';
    else if(xlRaw==='例假')xlType='off';
    else{xlType='work';xlShift=xlRaw;}

    // 比對
    let mismatch=false,reason='';
    if(xlType==='work'){
      if(appType!=='work'){
        mismatch=true;
        reason=`班表：${xlShift}，App：${AL[appType]||appType}`;
      }else if((appInfo.shiftId||'')!==xlShift){
        mismatch=true;
        reason=`班表：${xlShift}，App：${appInfo.shiftId||'?'}`;
      }
    }else if(xlType==='off'){
      if(appType!=='off'){
        mismatch=true;
        reason=`班表：例假，App：${AL[appType]||appType}`;
      }
    }else{
      if(appType==='work'){
        mismatch=true;
        reason=`班表：休班，App：${appInfo.shiftId||'工作班'}`;
      }else if(appType==='off'){
        mismatch=true;
        reason=`班表：休班，App：例假`;
      }
    }
    if(mismatch)errors.push({d,ds,reason});
  }

  let body;
  if(!errors.length){
    body=`<div style="text-align:center;padding:28px 0">
      <div style="font-size:36px;margin-bottom:10px">✅</div>
      <div style="font-size:15px;font-weight:700;color:var(--g)">全部正確！</div>
      <div style="font-size:12px;color:var(--tx3);margin-top:5px">${year}年${month}月共 ${totalDays} 天，與班表完全吻合</div>
    </div>`;
  }else{
    body=`<div style="font-size:13px;color:var(--r);font-weight:700;margin-bottom:12px">⚠ 發現 ${errors.length} 天有差異</div>
      <div style="display:flex;flex-direction:column;gap:7px;max-height:55vh;overflow-y:auto">
        ${errors.map(err=>`
          <div style="background:var(--r-d);border:1px solid rgba(239,68,68,.2);border-radius:var(--rad-s);padding:9px 12px">
            <div style="font-size:12px;font-weight:700;margin-bottom:2px">${year}/${p2(month)}/${p2(err.d)}（${wd(err.ds)}）</div>
            <div style="font-size:12px;color:var(--tx2)">${err.reason}</div>
          </div>`).join('')}
      </div>`;
  }
  setModal(`${worker.name} — ${year}年${month}月核對結果`,body,
    [{label:'關閉',cls:'btn-secondary',fn:'closeM()'}],true);
}

// ══════════════════════════════════════════════
// MODAL / TOAST / NAV / INIT
// ══════════════════════════════════════════════
function setModal(title,body,actions,wide){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalBox').className='modal'+(wide?' modal-wide':'');
  document.getElementById('modalActions').innerHTML=actions.map(a=>`<button class="btn ${a.cls}" onclick="${a.fn}">${a.label}</button>`).join('');
  document.getElementById('overlay').classList.add('open');
  _sheetOpen();
}
function overlayClick(e){ if(!_adminAuthPending && e.target===document.getElementById('overlay'))closeM(); }
function closeM(){
  const ov=document.getElementById('overlay');
  if(_isSheet()&&ov.classList.contains('open')){ ov.classList.remove('open'); _sheetClose(0); }
  else ov.classList.remove('open');
}

/* ── 手機底部彈簧面板（Apple design：spring damping 0.8 / response 0.3、
      1:1 拖曳、橡皮筋阻尼、放手速度接手、可中途打斷） ── */
const _SHEET_MQ=matchMedia('(max-width:640px)');
const _REDUCE_MOTION=matchMedia('(prefers-reduced-motion: reduce)');
function _isSheet(){ return _SHEET_MQ.matches && !_REDUCE_MOTION.matches; }
let _shRaf=null,_shY=0;
function _shBox(){ return document.getElementById('modalBox'); }
function _shH(){ return _shBox().offsetHeight+60; }
function _shApply(){ _shBox().style.transform=`translateY(${_shY}px)`; }
function _shSpring(target,v0,done){
  cancelAnimationFrame(_shRaf);
  const zeta=0.8, omega=2*Math.PI/0.3;
  let x=_shY, v=v0||0, last=performance.now();
  function step(now){
    const dt=Math.min(.032,(now-last)/1000); last=now;
    const a=-omega*omega*(x-target)-2*zeta*omega*v;
    v+=a*dt; x+=v*dt;
    _shY=x; _shApply();
    if(Math.abs(x-target)<.3&&Math.abs(v)<.3){ _shY=target; _shApply(); done&&done(); return; }
    _shRaf=requestAnimationFrame(step);
  }
  _shRaf=requestAnimationFrame(step);
}
function _sheetOpen(){
  const m=_shBox();
  if(_SHEET_MQ.matches){
    if(_REDUCE_MOTION.matches){ m.style.transform='translateY(0)'; return; }
    cancelAnimationFrame(_shRaf);
    _shY=_shH(); _shApply();
    _shSpring(0,0);
  }else m.style.transform='';
}
function _sheetClose(v0){
  const m=_shBox();
  if(_REDUCE_MOTION.matches){ m.style.transform=''; return; }
  _shSpring(_shH(),v0||0,()=>{ m.style.transform=''; });
}
(function(){
  const grab=document.getElementById('modalGrab');
  function _rubber(over,dim,c=0.55){ return (over*dim*c)/(dim+c*Math.abs(over)); }
  let drag=false,py0=0,y0=0,lastY=0,lastT=0,vel=0;
  grab.addEventListener('pointerdown',e=>{
    if(!_isSheet())return;
    drag=true; cancelAnimationFrame(_shRaf);
    py0=e.clientY; y0=_shY; lastY=e.clientY; lastT=performance.now(); vel=0;
    grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove',e=>{
    if(!drag)return;
    const now=performance.now(), dt=now-lastT;
    if(dt>0){ vel=(e.clientY-lastY)/dt*1000; lastY=e.clientY; lastT=now; }
    let ny=y0+(e.clientY-py0);
    if(ny<0) ny=_rubber(ny,_shH());
    _shY=ny; _shApply();
  });
  const end=()=>{
    if(!drag)return; drag=false;
    if(_adminAuthPending){ _shSpring(0,vel/60); return; }
    const rate=0.99;
    const projected=_shY+(vel/1000)*rate/(1-rate)*16;
    if(projected>_shH()*0.35){ document.getElementById('overlay').classList.remove('open'); _sheetClose(vel/60); }
    else _shSpring(0,vel/60);
  };
  grab.addEventListener('pointerup',end);
  grab.addEventListener('pointercancel',end);
})();
function toast(msg,type='ok'){ const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; document.getElementById('toastWrap').appendChild(el); setTimeout(()=>el.remove(),3000); }
let _pageIdx=0;
function _slideIn(el,dir){
  if(!el)return;
  el.classList.remove('slide-l','slide-r');
  void el.offsetWidth;
  el.classList.add(dir>0?'slide-l':'slide-r');
  el.addEventListener('animationend',()=>el.classList.remove('slide-l','slide-r'),{once:true});
}
function _moveTabLens(){
  const lens=document.getElementById('tabLens'), act=document.querySelector('.nav-tab.active');
  if(!lens||!act||!act.offsetWidth)return;
  lens.style.width=act.offsetWidth+'px';
  lens.style.transform=`translateX(${act.offsetLeft}px)`;
}
function showPage(name){
  const already=document.getElementById('page-'+name)?.classList.contains('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const idx={home:0,calendar:1,livetrain:2,schedule:3,shifts:4};
  document.querySelectorAll('.nav-tab')[idx[name]]?.classList.add('active');
  const dir=idx[name]-_pageIdx; _pageIdx=idx[name];
  if(dir!==0&&!already) _slideIn(document.getElementById('page-'+name),dir);
  requestAnimationFrame(_moveTabLens);
  if(name==='home'){ if(already) homeOffset=0; renderHome(); }
  if(name==='calendar'){ if(already||!calY||!calM){calY=new Date().getFullYear();calM=new Date().getMonth()+1;} renderCal(); calcLeaveStats(); }
  if(name==='livetrain') showLiveTrain();
  if(name==='schedule')renderSegs();
  if(name==='shifts'){ renderCommuteCard(); renderShifts(); }
}
function showApp(){
  document.getElementById('loading').style.display='none';
  const app=document.getElementById('app');
  app.classList.remove('app-hidden');
  app.style.display='flex';
  if(COMPACT_MODE) app.classList.add('compact-mode');
  renderHome();
  requestAnimationFrame(_moveTabLens);
}

/* ── 左右滑動手勢：首頁切日期、月曆切月份（~10px 門檻、水平意圖判定） ── */
function _addSwipe(el,fn){
  let sx=0,sy=0,t0=0,tracking=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; t0=Date.now(); tracking=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!tracking)return; tracking=false;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*2 && Date.now()-t0<600) fn(dx<0?1:-1);
  },{passive:true});
}
_addSwipe(document.getElementById('page-home'),d=>homeMove(d));
_addSwipe(document.getElementById('page-calendar'),d=>calMove(d));
window.addEventListener('resize',_moveTabLens);

/* ── 頂欄即時時鐘（顯示到秒） ── */
function _tickClock(){
  const el=document.getElementById('topClock'); if(!el)return;
  const n=new Date();
  el.textContent=`${p2(n.getHours())}:${p2(n.getMinutes())}:${p2(n.getSeconds())}`;
}
_tickClock();
setInterval(_tickClock,1000);
let _adminAuthPending = false;
async function _verifyToken(token){
  if(window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1') return !!token;
  try{
    const res = await fetch(SB+'/functions/v1/write-data',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'X-Write-Token':token},
      body:JSON.stringify({verify:true})
    });
    return res.status===204;
  }catch{ return false; }
}
function _showAdminModal(errMsg){
  _adminAuthPending=true;
  setModal('管理員驗證',
    (errMsg?`<div style="color:var(--r);font-size:13px;margin-bottom:10px">⚠ ${errMsg}</div>`:'') +
    `<div class="fg"><label class="fl">管理員密碼</label>
     <input class="fi" type="password" id="wtInput" placeholder="請輸入密碼" autocomplete="current-password" style="font-size:16px"></div>`,
    [{label:'確認',cls:'btn-primary',fn:'_confirmAdminLogin()'}]
  );
  setTimeout(()=>document.getElementById('wtInput')?.focus(),100);
}
window._confirmAdminLogin = async function(){
  const val=(document.getElementById('wtInput')?.value||'').trim();
  if(!val) return;
  const btn=document.querySelector('#modalActions .btn-primary');
  if(btn){btn.textContent='驗證中...';btn.disabled=true;}
  const ok=await _verifyToken(val);
  if(ok){
    _saveWT(val);_adminAuthPending=false;closeM();
    document.getElementById('app').classList.add('edit-mode');
  }else{
    _showAdminModal('密碼錯誤，請重試');
  }
};
async function _initAdminAuth(){
  const saved=_getWT();
  if(saved){
    const ok=await _verifyToken(saved);
    if(ok){document.getElementById('app').classList.add('edit-mode');return;}
    _clearWT();
  }
  _showAdminModal();
}
function init(){
  try{
    try{ loadLocal(); }catch(e){ console.warn('loadLocal failed:',e); ST.shifts=[]; ST.segments=[]; ST.exceptions={}; }
    showApp();
    if(EDIT_MODE) _initAdminAuth();
    setTimeout(()=>{ initDB().catch(e=>console.warn('Supabase error:',e)); }, 100);
  }catch(err){
    console.error('FATAL init error:', err);
    // Force-show app as last resort
    try{
      document.getElementById('loading').style.display='none';
      document.getElementById('app').style.display='flex';
      document.getElementById('app').classList.remove('app-hidden');
      document.body.innerHTML+='<div style="position:fixed;top:60px;left:10px;right:10px;background:#4a1414;color:#f87171;padding:16px;border-radius:8px;z-index:9999;font-size:13px;">⚠️ 初始化錯誤：'+err.message+'<br><br>請截圖給開發者。</div>';
    }catch(e2){}
  }
}

// Safety net: force-hide loading after 3 seconds no matter what
setTimeout(function(){
  try{
    var l=document.getElementById('loading');
    var a=document.getElementById('app');
    if(l && l.style.display!=='none'){
      l.style.display='none';
      if(a){ a.style.display='flex'; a.classList.remove('app-hidden'); }
      document.body.innerHTML+='<div style="position:fixed;top:60px;left:10px;right:10px;background:#4a3010;color:#fbbf24;padding:16px;border-radius:8px;z-index:9999;font-size:13px;">⚠️ 強制顯示（啟動超時）。如果看到這個訊息表示 JavaScript 初始化有問題。</div>';
    }
  }catch(e){}
}, 3000);

// Run init
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
